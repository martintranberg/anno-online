    };
    const tierName = (t) => HOUSE_LEVELS[t].name;

    // Tools that aren't buildings
    const TOOLS = {
      demolish: { id: 'demolish', name: 'Riv ned', desc: 'Fjerner veje, broer og bygninger (50% af materialerne retur). På en kanal fyldes den op igen.' }
    };
    const itemInfo = (id) => DEFS[id] || TOOLS[id];

    // Build menu grouping
    const CATEGORIES = [
      { id: 'terrain', name: 'Terræn', icon: '🛤️', items: ['road', 'canal', 'demolish'] },
      { id: 'housing', name: 'Boliger', icon: '🏠', items: ['house'] },
      { id: 'production', name: 'Produktion', icon: '🪵', items: ['woodcutter', 'forester', 'sawmill', 'stonecutter', 'sheepfarm', 'weaver'] },
      { id: 'food', name: 'Mad & drikke', icon: '🌾', items: ['fisher', 'grainfarm', 'pigfarm', 'cattlefarm', 'hopfarm', 'brewery'] },
      { id: 'harbor', name: 'Lager & havn', icon: '⚓', items: ['warehouse', 'shipyard'] }
    ];

    // Buildings that only work when connected to a warehouse by road
    const needsRoad = (def) => !!(def.produces || def.consumes || def.needsRoad);
    const isLandType = (type) => type === 'grass' || type === 'beach';

    const ISO = {
      TW: 64,
      TH: 32,
      // Accepts fractional tile coords; integer coords give the tile centre
      tileToScreen: (tx, ty) => ({
        x: (tx - ty) * 32,
        y: (tx + ty) * 16
      }),
      screenToTile: (sx, sy) => ({
        tx: Math.round((sx / 32 + sy / 16) / 2),
        ty: Math.round((sy / 16 - sx / 32) / 2)
      })
    };

    // ===== TERRAIN GENERATION: ARCHIPELAGO =====
    // One large home island in the middle, several smaller islands around it, open sea in between.
    // Forests, rock outcrops and small lakes are then scattered over the land.
    function generateTerrain(w, h) {
      const grid = [];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) grid.push({ x, y, type: 'water' });
      }
      const at = (x, y) => (x >= 0 && y >= 0 && x < w && y < h) ? grid[y * w + x] : null;

      // Island blobs
      const islands = [{ cx: w / 2, cy: h / 2, r: w * 0.17 }];
      const target = 6 + Math.floor(Math.random() * 3);
      for (let tries = 0; islands.length < target && tries < 800; tries++) {
        const r = 4.5 + Math.random() * w * 0.08;
        const cx = r + 4 + Math.random() * (w - 2 * r - 8);
        const cy = r + 4 + Math.random() * (h - 2 * r - 8);
        if (islands.every(o => Math.hypot(o.cx - cx, o.cy - cy) > o.r + r + 5)) islands.push({ cx, cy, r });
      }
      const off = Math.random() * 1000;
      for (const t of grid) {
        for (const isl of islands) {
          // Noise-wobbled radius gives natural, irregular coastlines
          const wobble = 0.7 + 0.6 * valueNoise((t.x + off) / 5, (t.y + off) / 5);
          if (Math.hypot(t.x - isl.cx, t.y - isl.cy) / isl.r < wobble) { t.type = 'grass'; break; }
        }
      }

      // Clusters on land only. Centres are picked on land tiles; the home island is guaranteed forest and rock.
      const land = grid.filter(t => t.type === 'grass');
      const home = islands[0];
      const homeLand = land.filter(t => Math.hypot(t.x - home.cx, t.y - home.cy) < home.r * 0.8);
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const clusters = [];
      const addClusters = (pool, n, type, rMin, rMax) => {
        for (let i = 0; i < n && pool.length; i++) {
          const c = pick(pool);
          clusters.push({ cx: c.x, cy: c.y, radius: rMin + Math.random() * (rMax - rMin), type });
        }
      };
      addClusters(homeLand, 3, 'forest', 3, 5.5);
      addClusters(homeLand, 2, 'rock', 1.5, 3);
      addClusters(land, Math.round(land.length / 140), 'forest', 2.5, 5);
      addClusters(land, Math.round(land.length / 450), 'rock', 1.5, 3.5);
      addClusters(land, Math.round(land.length / 700), 'lake', 1.5, 3);

      for (const t of land) {
        for (const c of clusters) {
          const d = Math.hypot(t.x - c.cx, t.y - c.cy);
          const type = c.type === 'lake' ? 'water' : c.type;
          if (d < c.radius) t.type = type;
          else if (d < c.radius + 2 && Math.random() < 0.3) t.type = type; // ragged edges
        }
      }

      // Beaches along coasts
      for (const t of grid) {
        if (t.type !== 'grass') continue;
        let water = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if ((dx || dy) && at(t.x + dx, t.y + dy)?.type === 'water') water++;
          }
        }
        if (water > 0 && Math.random() < 0.5) t.type = 'beach';
      }
      return grid;
    }

    // ===== ISLANDS =====
    // Every connected landmass is an island with its own storage (shared by all warehouses on it).
    const ISLAND_NAMES = ['Mågeø', 'Ravneø', 'Falkeø', 'Tangø', 'Sælø', 'Lyngø', 'Egeø', 'Klippeø', 'Sandø',
                          'Ørneø', 'Tågeø', 'Stormø', 'Vindø', 'Rævø', 'Hjorteø', 'Birkeø', 'Svaneø', 'Kragø'];
    const tileAt = (x, y) => (x >= 0 && y >= 0 && x < MAP_SIZE && y < MAP_SIZE) ? GAME.grid[y * MAP_SIZE + x] : null;
    // A bridge (road on a canal tile) joins the land on both sides into one island; ships still pass beneath
    const isBridge = (t) => !!t && t.canal && GAME.roads.has(`${t.x},${t.y}`);
    const isLand = (t) => !!t && (t.type !== 'water' || isBridge(t));

    // Marks water connected to the map edge as open sea (tile.ocean). Lakes stay false until a canal joins them up.
    function markOcean() {
      const q = [];
      for (const t of GAME.grid) {
        t.ocean = false;
        const edge = t.x === 0 || t.y === 0 || t.x === MAP_SIZE - 1 || t.y === MAP_SIZE - 1;
        if (edge && t.type === 'water') { t.ocean = true; q.push(t); }
      }
      for (let i = 0; i < q.length; i++) {
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const n = tileAt(q[i].x + dx, q[i].y + dy);
          if (n && n.type === 'water' && !n.ocean) { n.ocean = true; q.push(n); }
        }
      }
    }

    // Labels connected land components (4-neighbour). Sets tile.island; returns the components.
    function labelIslands() {
      markOcean();
      for (const t of GAME.grid) t.island = null;
      const comps = [];
      let id = 0;
      for (const start of GAME.grid) {
        if (!isLand(start) || start.island !== null) continue;
        id++;
        start.island = id;
        const idx = [start.y * MAP_SIZE + start.x];
        for (let i = 0; i < idx.length; i++) {
          const t = GAME.grid[idx[i]];
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const n = tileAt(t.x + dx, t.y + dy);
            if (isLand(n) && n.island === null) { n.island = id; idx.push(n.y * MAP_SIZE + n.x); }
          }
        }
        // Anchor = first tile in row-major order: stable across reloads, used to match saved island data
        comps.push({ id, size: idx.length, anchor: [start.x, start.y], idx });
      }
      return comps;
    }

    function newIsland(comp) {
      const used = new Set([...GAME.islands.values()].map(i => i.name));
      let n = Math.floor(hash2(comp.anchor[0], comp.anchor[1]) * ISLAND_NAMES.length);
      for (let k = 0; k < ISLAND_NAMES.length && used.has(ISLAND_NAMES[n]); k++) n = (n + 1) % ISLAND_NAMES.length;
      return { id: comp.id, size: comp.size, anchor: comp.anchor, name: ISLAND_NAMES[n], home: false,
               resources: emptyStock(), pop: 0, hunger: 0, fertility: [], needsMet: {} };
    }

    // Gives each island its farming fertility. The home island only has grain, so wool (cloth) and hops (beer)
    // must come from other islands - the reason to build ships. The two nearest islands are guaranteed sheep and hops.
    function assignFertility(homeId) {
      const centre = (id) => {
        const ts = GAME.grid.filter(t => t.island === id);
        return [ts.reduce((s, t) => s + t.x, 0) / ts.length, ts.reduce((s, t) => s + t.y, 0) / ts.length];
      };
      const home = GAME.islands.get(homeId);
      const [hx, hy] = centre(homeId);
      home.fertility = ['grain'];
      const others = [...GAME.islands.values()].filter(i => i.id !== homeId && i.size >= 12)
        .map(i => { const [x, y] = centre(i.id); return { i, d: Math.hypot(x - hx, y - hy) }; })
        .sort((a, b) => a.d - b.d).map(o => o.i);
      const keys = Object.keys(FERTILITY);
      others.forEach((isl, n) => {
        const f = new Set();
        if (n === 0) f.add('sheep');
        if (n === 1) f.add('hops');
        const r = hash2(isl.anchor[0] + 77, isl.anchor[1] + 13);
        f.add(keys[Math.floor(r * keys.length)]);
        if (r > 0.55) f.add(keys[Math.floor(hash2(isl.anchor[1], isl.anchor[0]) * keys.length)]);
        isl.fertility = [...f];
      });
    }

    // Re-label islands after the terrain changed (e.g. a canal split a landmass), keeping each island's
    // data with the component that holds most of its old tiles. Bigger components claim first.
    function recomputeIslands() {
      const prevLabel = GAME.grid.map(t => t.island ?? null);
      const prev = GAME.islands;
      const comps = labelIslands().sort((a, b) => b.size - a.size);
      const next = new Map();
      const claimed = new Set();
      const compCounts = new Map();
      GAME.islands = next; // so newIsland() sees names already taken in this pass
      for (const c of comps) {
        const counts = new Map();
        for (const i of c.idx) {
          const p = prevLabel[i];
          if (p !== null) counts.set(p, (counts.get(p) || 0) + 1);
        }
        compCounts.set(c.id, counts);
        let best = null, bestN = 0;
        for (const [p, n] of counts) if (!claimed.has(p) && prev.has(p) && n > bestN) { best = p; bestN = n; }
        if (best !== null) {
          claimed.add(best);
          next.set(c.id, { ...prev.get(best), id: c.id, size: c.size, anchor: c.anchor });
        } else {
          // A part split off an existing island keeps that island's fertility (but starts with empty storage)
          const isl = newIsland(c);
          let origin = null, originN = 0;
          for (const [p, n] of counts) if (prev.has(p) && n > originN) { origin = p; originN = n; }
          if (origin !== null) isl.fertility = [...prev.get(origin).fertility];
          next.set(c.id, isl);
        }
      }
      // Islands that were joined into another (e.g. by a bridge) hand over their goods, people and fertility
      for (const [p, old] of prev) {
        if (claimed.has(p)) continue;
        let into = null, intoN = 0;
        for (const [cid, counts] of compCounts) if ((counts.get(p) || 0) > intoN) { into = cid; intoN = counts.get(p); }
        if (into === null) continue;
        const isl = next.get(into);
        for (const k of RES_KEYS) isl.resources[k] += old.resources[k];
        isl.pop += old.pop;
        isl.home ||= old.home;
        isl.fertility = [...new Set([...isl.fertility, ...old.fertility])];
      }
      updateIslandStats();
      invalidateRoutes(); // water paths may have changed
    }

    const islandOfBuilding = (b) => GAME.islands.get(tileAt(b.x, b.y)?.island);

    // A house's capacity: full for its level when that level's needs were met last tick, otherwise the level below
    function houseCap(b, isl) {
      const L = b.level || 1;
      const met = HOUSE_LEVELS[L].needs.every(n => isl.needsMet[n] !== false);
      return HOUSE_LEVELS[met || L === 1 ? L : L - 1].cap;
    }

    // Derived per-island numbers: warehouses, storage cap, housing capacity (total and per house level)
    function updateIslandStats() {
      for (const isl of GAME.islands.values()) {
        isl.warehouses = 0;
        isl.popCap = 0;
        isl.cap = 0;
        isl.levelCap = [0, 0, 0, 0];
        isl.houses = 0;
      }
      for (const b of GAME.buildings) {
        const isl = islandOfBuilding(b);
        if (!isl) continue;
        const def = DEFS[b.type];
        if (b.type === 'warehouse') { isl.warehouses++; isl.cap += def.storage; }
        if (def.house) {
          const c = houseCap(b, isl);
          isl.popCap += c;
          isl.levelCap[b.level || 1] += c;
          isl.houses++;
        }
      }
    }

    // Residents per house level on an island (population is spread over the houses by capacity)
    const popByLevel = (isl) => isl.levelCap.map(c => isl.popCap ? isl.pop * c / isl.popCap : 0);

    const totalPopulation = () => [...GAME.islands.values()].reduce((s, i) => s + i.pop, 0);
    const totalPopCap = () => [...GAME.islands.values()].reduce((s, i) => s + i.popCap, 0);
    const homeIsland = () => [...GAME.islands.values()].find(i => i.home);

    // ===== RENDERING =====
    const canvas = document.getElementById('canvas');
    // `let` so build-menu previews can temporarily redirect all drawing to their own canvas
    let ctx = canvas.getContext('2d');
    let animTime = 0; // ms, drives smoke, flags and saw blades

    // Fallback colours (used e.g. by build-menu previews whose tiles aren't decorated)
    const TERRAIN_COLORS = {
      grass: '#6aa444',
      forest: '#467e32',
      beach: '#e0cc92',
      water: '#2a78b0',
      rock: '#948f80'
    };
    const SEA_COLOR = '#1b5487'; // background outside the map
    const DETAIL_ZOOM = 0.7;     // below this zoom, tiny ground details are skipped
    const WAVE_ZOOM = 0.6;       // below this zoom, animated wave crests are skipped

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    // ----- Noise & colour helpers -----
    // Seeds all per-tile decoration; stored in save games so a loaded map looks identical
    let NOISE_SEED = Math.floor(Math.random() * 100000);

    function hash2(x, y) {
      let h = Math.imul(x + NOISE_SEED, 374761393) + Math.imul(y, 668265263);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }

    // Smooth value noise in 0..1
    function valueNoise(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const sm = (t) => t * t * (3 - 2 * t);
      const u = sm(x - xi), v = sm(y - yi);
      const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    const fbm = (x, y) => valueNoise(x, y) * 0.65 + valueNoise(x * 2.3 + 17, y * 2.3 + 5) * 0.35;

    function mix(a, b, t) {
      const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
      const ch = (s) => Math.round(((pa >> s) & 255) + (((pb >> s) & 255) - ((pa >> s) & 255)) * t);
      return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
    }

    // ----- Per-tile look, computed once after terrain generation -----
    const FLOWER_COLORS = ['#f4f0e0', '#f2d040', '#e87890', '#b890e0'];
    const SHORE_EDGES = { '0,-1': [[-0.5, -0.5], [0.5, -0.5]], '1,0': [[0.5, -0.5], [0.5, 0.5]],
                          '0,1': [[0.5, 0.5], [-0.5, 0.5]], '-1,0': [[-0.5, 0.5], [-0.5, -0.5]] };
    const DIRS4 = [[0, -1], [1, 0], [0, 1], [-1, 0]];

    const TREE_HUES = 4; // colour variants per tree kind (each becomes one cached sprite)

    function makeTree(rnd, n, u, v) {
      const bucket = Math.floor(rnd() * TREE_HUES);
      const hue = (bucket + 0.5) / TREE_HUES;
      const tree = { u, v, s: 0.75 + rnd() * 0.4 };
      tree.conifer = rnd() < 0.2 + n * 0.5; // conifers cluster in the darker noise areas
      const autumn = !tree.conifer && rnd() < 0.06;
      tree.key = `${tree.conifer ? 'c' : autumn ? 'a' : 'd'}${bucket}`;
      if (tree.conifer) {
        tree.dark = mix('#2a5a2e', '#36683a', hue);
        tree.light = mix('#4a8a46', '#5c9c50', hue);
      } else if (autumn) {
        // The odd autumn-coloured tree for a bit of life
        tree.dark = mix('#9a5a1e', '#8a6a1a', hue);
        tree.mid = mix('#d08a2a', '#c8a030', hue);
        tree.light = mix('#f0b848', '#e8c858', hue);
      } else {
        tree.dark = mix('#2e6624', '#3c7628', hue);
        tree.mid = mix('#4a9232', '#5aa03a', hue);
        tree.light = mix('#7abe50', '#8ccc5c', hue);
      }
      return tree;
    }

    function decorateTerrain(grid) {
      const at = (x, y) => (x >= 0 && y >= 0 && x < MAP_SIZE && y < MAP_SIZE) ? grid[y * MAP_SIZE + x] : null;

      // Water depth = steps to the nearest land tile (BFS from the shoreline)
      const queue = [];
      for (const t of grid) {
        if (t.type !== 'water') continue;
        t.landDirs = DIRS4.filter(([dx, dy]) => { const n = at(t.x + dx, t.y + dy); return n && n.type !== 'water'; });
        t.shore = t.landDirs.map(([dx, dy]) => SHORE_EDGES[`${dx},${dy}`]);
        t.depth = t.shore.length ? 1 : 99;
        if (t.shore.length) queue.push(t);
        else t.shore = null;
      }
      while (queue.length) {
        const t = queue.shift();
        for (const [dx, dy] of DIRS4) {
          const n = at(t.x + dx, t.y + dy);
          if (n && n.type === 'water' && n.depth > t.depth + 1) { n.depth = t.depth + 1; queue.push(n); }
        }
      }

      for (const t of grid) decorateTile(t);
      groupRocks(grid, at);
    }

    // Per-tile colour, decoration and trees. Deterministic per position, so it can be re-run for a single
    // tile (e.g. when a forester plants trees) without changing anything else.
    const TREE_SLOTS = [[-0.22, -0.2], [0.2, -0.16], [-0.14, 0.2], [0.22, 0.2]];
    function decorateTile(t) {
      const n = fbm(t.x / 6, t.y / 6);
      const rnd = seeded(t.x * 7919 + t.y * 104729 + NOISE_SEED);
      t.decor = null;
      t.trees = null;
      t.object = null;
      const at2 = () => rnd() * 0.8 - 0.4;

      if (t.type === 'grass' && t.quarried) {
        // Worked-out quarry: grey gravel that never grows back
        t.color = mix('#8a8a70', '#a09c84', n);
        t.decor = [];
        for (let i = 0; i < 8; i++) t.decor.push({ k: 'speck', u: at2(), v: at2(), c: rnd() < 0.5 ? '#6e6a5e' : '#c4beac' });
        t.decor.push({ k: 'pebble', u: at2(), v: at2() }, { k: 'tuft', u: at2(), v: at2(), s: 0.7 });
      } else if (t.type === 'grass') {
        t.color = mix('#5a943a', '#86ba50', n);
        t.decor = [];
        // Felled forest leaves stumps until trees grow back
        if (t.stumps) for (let i = 0; i < 3; i++) t.decor.push({ k: 'stump', u: TREE_SLOTS[i][0], v: TREE_SLOTS[i][1] });
        for (let i = 0, m = 2 + Math.floor(rnd() * 3); i < m; i++) t.decor.push({ k: 'tuft', u: at2(), v: at2(), s: 0.7 + rnd() * 0.6 });
        if (valueNoise(t.x / 4 + 50, t.y / 4 + 50) > 0.62) {
          for (let i = 0, m = 2 + Math.floor(rnd() * 4); i < m; i++) {
            t.decor.push({ k: 'flower', u: at2(), v: at2(), c: FLOWER_COLORS[Math.floor(rnd() * FLOWER_COLORS.length)] });
          }
        }
        if (rnd() < 0.05) t.decor.push({ k: 'pebble', u: at2(), v: at2() });
        const r = rnd();
        if (t.stumps) { /* no lone trees or bushes on a clearing */ }
        else if (r < 0.035) t.object = { k: 'bush', u: rnd() * 0.4 - 0.2, v: rnd() * 0.4 - 0.2, s: 0.24 + rnd() * 0.12 };
        else if (r < 0.05) t.object = { k: 'tree', tree: makeTree(rnd, n, rnd() * 0.3 - 0.15, rnd() * 0.3 - 0.15) };
      } else if (t.type === 'forest') {
        t.color = mix('#3a6c2a', '#528a36', n);
        const count = 2 + (rnd() < 0.45 ? 1 : 0);
        const start = Math.floor(rnd() * 4);
        t.trees = [];
        for (let i = 0; i < count; i++) {
          const [su, sv] = TREE_SLOTS[(start + i) % 4];
          t.trees.push(makeTree(rnd, n, su + rnd() * 0.12 - 0.06, sv + rnd() * 0.12 - 0.06));
        }
        t.trees.sort((a, b) => (a.u + a.v) - (b.u + b.v)); // back to front
        t.decor = [{ k: 'tuft', u: at2(), v: at2(), s: 1 }];
        // Harvestable wood: WOOD_PER_TREE per tree; a fresh map starts fully grown
        t.woodMax = count * WOOD_PER_TREE;
        t.wood = Math.min(t.wood ?? t.woodMax, t.woodMax);
      } else if (t.type === 'beach') {
        t.color = mix('#d4bd84', '#ecdca8', n);
        t.decor = [];
        for (let i = 0; i < 6; i++) t.decor.push({ k: 'speck', u: at2(), v: at2(), c: rnd() < 0.5 ? '#bfa872' : '#f6ecc8' });
        if (rnd() < 0.12) t.decor.push({ k: 'shell', u: at2(), v: at2() });
      } else if (t.type === 'water') {
        const d = Math.min(t.depth, 4);
        t.color = mix('#58b2d2', '#1e5e96', (d - 1) / 3);
        t.wave = rnd() < 0.45 ? { u: at2() * 0.8, v: at2() * 0.8, ph: rnd() * Math.PI * 2 } : null;
      } else if (t.type === 'rock') {
        t.color = mix('#868272', '#a09a88', n);
        t.decor = [];
        for (let i = 0; i < 5; i++) t.decor.push({ k: 'speck', u: at2(), v: at2(), c: rnd() < 0.5 ? '#6e6a5e' : '#bcb6a4' });
        t.stone = t.stone ?? ROCK_STONE; // finite: quarried stone never comes back
      }
    }

    // ----- Mountains: connected rock tiles grouped (max 10) into small faceted peaks -----
    const MOUNTAIN_MAX = 10;
    const LIGHT_DIR = (() => { const l = [0.75, -0.25, 0.9]; const m = Math.hypot(...l); return l.map(c => c / m); })();
    const hexArr = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const lerpArr = (a, b, t) => a.map((c, i) => c + (b[i] - c) * t);
    const rgbArr = (a, f = 1) => `rgb(${a.map(c => Math.min(255, Math.round(c * f))).join(',')})`;
    const MOSS = hexArr('#7e8662'), STONE = hexArr('#a29c8e'), SNOW = hexArr('#eef1f2'), GRASS = hexArr('#6a9c44');
    const GRASS_LINE = 5; // px height below which mountain slopes are grassy

    // Part of a 3D triangle below (keepBelow) or above a height level; null if nothing remains
    function clipZ(tri, level, keepBelow) {
      const out = [];
      for (let i = 0; i < 3; i++) {
        const a = tri[i], b = tri[(i + 1) % 3];
        const inA = keepBelow ? a[2] <= level : a[2] >= level;
        const inB = keepBelow ? b[2] <= level : b[2] >= level;
        if (inA) out.push(a);
        if (inA !== inB) {
          const t = (level - a[2]) / (b[2] - a[2]);
          out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, level]);
        }
      }
      return out.length >= 3 ? out : null;
    }

    function groupRocks(grid, at) {
      const assigned = new Set();
      let gid = 0;
      for (const start of grid) {
        if (start.type !== 'rock' || assigned.has(start)) continue;
        // Grow a group breadth-first from this tile until it has MOUNTAIN_MAX tiles
        const group = [start];
        assigned.add(start);
        for (let i = 0; i < group.length && group.length < MOUNTAIN_MAX; i++) {
          for (const [dx, dy] of DIRS4) {
            const nb = at(group[i].x + dx, group[i].y + dy);
            if (nb && nb.type === 'rock' && !assigned.has(nb) && group.length < MOUNTAIN_MAX) {
              assigned.add(nb);
              group.push(nb);
            }
          }
        }
        gid++;
        for (const t of group) t.rockGroup = gid;
        if (group.length >= 2) buildMountain(group, at);
        else {
          // Lone boulders sit on grassy gravel rather than a bare grey tile
          start.color = mix('#6e8a4c', '#8a9064', fbm(start.x / 6, start.y / 6));
          start.decor.push({ k: 'tuft', u: 0.3, v: -0.25, s: 1 }, { k: 'tuft', u: -0.3, v: 0.3, s: 0.8 });
        }
      }
    }

    function buildMountain(group, at) {
      const n = group.length, gid = group[0].rockGroup;
      const inG = (x, y) => { const t = at(x, y); return t && t.rockGroup === gid ? t : null; };
      // Jitter keyed on world position, so vertices shared between tiles get the same value
      const jit = (x, y, amp) => (hash2(Math.round(x * 2) + 5000, Math.round(y * 2) + 9000) - 0.5) * 2 * amp;

      const cx = group.reduce((s, t) => s + t.x, 0) / n, cy = group.reduce((s, t) => s + t.y, 0) / n;
      const dmax = Math.max(...group.map(t => Math.hypot(t.x - cx, t.y - cy))) + 0.7;
      const sizeF = Math.sqrt(n / MOUNTAIN_MAX); // bigger groups grow taller
      for (const t of group) {
        const left = 0.35 + 0.65 * ((t.stone ?? ROCK_STONE) / ROCK_STONE); // quarried tiles sink
        t.hc = (10 + 6 * sizeF + 38 * sizeF * (1 - Math.hypot(t.x - cx, t.y - cy) / dmax)) * left + jit(t.x, t.y, 4);
      }
      const peak = Math.max(...group.map(t => t.hc));
      const snowLine = n >= 8 ? peak * 0.84 : Infinity; // only the biggest peaks get a snow cap

      for (const t of group) {
        const { x, y } = t;
        // Corner raised only when it is surrounded by 3-4 tiles of the same group; otherwise it's at ground level
        const cornerH = (ox, oy) => {
          const bx = x + (ox < 0 ? -1 : 0), by = y + (oy < 0 ? -1 : 0);
          const ts = [inG(bx, by), inG(bx + 1, by), inG(bx, by + 1), inG(bx + 1, by + 1)].filter(Boolean);
          const f = ts.length === 4 ? 0.95 : ts.length === 3 ? 0.68 : 0;
          return f ? (ts.reduce((s, q) => s + q.hc, 0) / ts.length) * f + jit(x + ox, y + oy, 3) : 0;
        };
        // Edge midpoint raised when the neighbour across it belongs to the group -> continuous ridges
        const midH = (dx, dy) => {
          const nb = inG(x + dx, y + dy);
          return nb ? ((t.hc + nb.hc) / 2) * 0.92 + jit(x + dx / 2, y + dy / 2, 3) : 0;
        };

        const TL = [x - 0.5, y - 0.5, cornerH(-0.5, -0.5)], TR = [x + 0.5, y - 0.5, cornerH(0.5, -0.5)];
        const BR = [x + 0.5, y + 0.5, cornerH(0.5, 0.5)], BL = [x - 0.5, y + 0.5, cornerH(-0.5, 0.5)];
        const Nm = [x, y - 0.5, midH(0, -1)], Em = [x + 0.5, y, midH(1, 0)];
        const Sm = [x, y + 0.5, midH(0, 1)], Wm = [x - 0.5, y, midH(-1, 0)];
        const C = [x, y, t.hc];
        // Back facets (north, west) first, then the front ones (east, south)
        const tris = [[TL, Nm, C], [Nm, TR, C], [BL, Wm, C], [Wm, TL, C], [TR, Em, C], [Em, BR, C], [BR, Sm, C], [Sm, BL, C]];

        t.mountain = tris.map(tri => {
          const [a, b, c] = tri, S = 40; // S: horizontal world scale (px per tile) for normals
          const ab = [(b[0] - a[0]) * S, (b[1] - a[1]) * S, b[2] - a[2]];
          const ac = [(c[0] - a[0]) * S, (c[1] - a[1]) * S, c[2] - a[2]];
          let nx = ab[1] * ac[2] - ab[2] * ac[1], ny = ab[2] * ac[0] - ab[0] * ac[2], nz = ab[0] * ac[1] - ab[1] * ac[0];
          if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
          const len = Math.hypot(nx, ny, nz) || 1;
          const lit = Math.max(0, (nx * LIGHT_DIR[0] + ny * LIGHT_DIR[1] + nz * LIGHT_DIR[2]) / len);
          const hAvg = (a[2] + b[2] + c[2]) / 3;
          const base = lerpArr(MOSS, STONE, Math.min(1, Math.max(0, (hAvg - 4) / 16)));
          const toScreen = (poly3) => poly3.map(([u, v, z]) => P(u, v, z));
          // Grass at the foot and snow at the top follow height contours, not facet edges
          const bands = [];
          const grass = clipZ(tri, GRASS_LINE, true);
          if (grass) bands.push({ pts: toScreen(grass), col: rgbArr(GRASS, 0.72 + 0.4 * lit) });
          const snow = clipZ(tri, snowLine, false);
          if (snow) bands.push({ pts: toScreen(snow), col: rgbArr(SNOW, 0.82 + 0.22 * lit), snow: true });
          return { pts: toScreen(tri), col: rgbArr(base, 0.56 + 0.52 * lit), h: hAvg, bands };
        });

        // Details: grass tufts on the low slopes, loose scree at the foot of the front edges
        const rnd = seeded(x * 48611 + y * 96769 + NOISE_SEED);
        t.slopeTufts = [];
        for (const tri of t.mountain) {
          if (tri.h < 9 && rnd() < 0.8) {
            const [a, b, c] = tri.pts, w1 = rnd() * 0.5, w2 = rnd() * (1 - w1);
            t.slopeTufts.push({ x: a.x + (b.x - a.x) * w1 + (c.x - a.x) * w2, y: a.y + (b.y - a.y) * w1 + (c.y - a.y) * w2 });
          }
        }
        t.scree = [];
        if (!inG(x + 1, y) && rnd() < 0.6) t.scree.push({ u: x + 0.6, v: y + rnd() * 0.6 - 0.3, r: 0.06 + rnd() * 0.05, seed: Math.floor(rnd() * 1e9) });
        if (!inG(x, y + 1) && rnd() < 0.6) t.scree.push({ u: x + rnd() * 0.6 - 0.3, v: y + 0.6, r: 0.06 + rnd() * 0.05, seed: Math.floor(rnd() * 1e9) });
      }
    }

    // Seamless rock texture (mid-grey = neutral), applied with 'overlay' so it only adds light/dark detail
    let rockPattern = null;
    function getRockPattern() {
      if (rockPattern) return rockPattern;
      const S = 192, c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d'), rnd = seeded(20240926);
      g.fillStyle = '#808080';
      g.fillRect(0, 0, S, S);
      // Draw each shape at the 9 wrap offsets so the texture tiles without seams
      const wrapped = (drawFn) => { for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) drawFn(ox, oy); };

      // Soft mottling
      for (let i = 0; i < 150; i++) {
        const x = rnd() * S, y = rnd() * S, rx = 4 + rnd() * 16, ry = 3 + rnd() * 8, rot = rnd() * Math.PI;
        const col = rnd() < 0.5 ? 'rgba(0,0,0,0.11)' : 'rgba(255,255,255,0.11)';
        wrapped((ox, oy) => { g.fillStyle = col; g.beginPath(); g.ellipse(x + ox, y + oy, rx, ry, rot, 0, Math.PI * 2); g.fill(); });
      }
      // Cracks / strata: a dark line with a light lip underneath
      for (let i = 0; i < 16; i++) {
        const pts = [[rnd() * S, rnd() * S]];
        for (let k = 0; k < 4; k++) { const [px, py] = pts[pts.length - 1]; pts.push([px + 4 + rnd() * 14, py + (rnd() - 0.5) * 9]); }
        wrapped((ox, oy) => {
          for (const [off, col] of [[1, 'rgba(255,255,255,0.28)'], [0, 'rgba(0,0,0,0.4)']]) {
            g.strokeStyle = col;
            g.lineWidth = 1.3;
            g.beginPath();
            pts.forEach(([px, py], k) => k ? g.lineTo(px + ox, py + oy + off) : g.moveTo(px + ox, py + oy + off));
            g.stroke();
          }
        });
      }
      // Fine grain
      const img = g.getImageData(0, 0, S, S);
      for (let i = 0; i < img.data.length; i += 4) {
        const d = (rnd() - 0.5) * 38;
        img.data[i] += d; img.data[i + 1] += d; img.data[i + 2] += d;
      }
      g.putImageData(img, 0, 0);

      rockPattern = ctx.createPattern(c, 'repeat');
      rockPattern.setTransform(new DOMMatrix().scale(0.5)); // 2 texels per world px -> crisp when zoomed in
      return rockPattern;
    }

    function rockTexture(polys, strength = 0.7, mode = 'overlay') {
      ctx.save();
      ctx.globalCompositeOperation = mode;
      ctx.globalAlpha *= strength;
      ctx.fillStyle = getRockPattern();
      ctx.beginPath();
      for (const pts of polys) {
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath();
      }
      ctx.fill();
      ctx.restore();
    }

    function drawMountainTile(tile) {
      // Stroke each facet in its own colour: hides hairline seams without drawing visible edges.
      // Bands are drawn right after their facet so later (front) facets still cover them correctly.
      for (const tri of tile.mountain) {
        poly(tri.col, tri.pts, tri.col);
        for (const b of tri.bands) poly(b.col, b.pts, b.col);
      }
      rockTexture(tile.mountain.map(tri => tri.pts), 0.6);
      // 'overlay' leaves near-white untouched, so snow gets a faint multiplied texture instead
      const snowPolys = tile.mountain.flatMap(tri => tri.bands.filter(b => b.snow).map(b => b.pts));
      if (snowPolys.length) rockTexture(snowPolys, 0.22, 'multiply');

      if (GAME.camera.zoom >= DETAIL_ZOOM && tile.slopeTufts.length) {
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#5a7a36';
        ctx.beginPath();
        for (const q of tile.slopeTufts) {
          ctx.moveTo(q.x - 2, q.y); ctx.lineTo(q.x - 3, q.y - 4);
          ctx.moveTo(q.x, q.y); ctx.lineTo(q.x, q.y - 5);
          ctx.moveTo(q.x + 2, q.y); ctx.lineTo(q.x + 3.5, q.y - 3.5);
        }
        ctx.stroke();
      }
      for (const s of tile.scree) boulder(s.u, s.v, s.r, seeded(s.seed));
    }

    // ----- Ground -----
    function drawTile(x, y, tile) {
      const p = ISO.tileToScreen(x, y);
      const TW = ISO.TW, TH = ISO.TH;
      const color = tile.color || TERRAIN_COLORS[tile.type];

      // Diamond enlarged by ~half a pixel so neighbouring tiles overlap and no seams show
      const e = 0.6;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - TH / 2 - e);
      ctx.lineTo(p.x + TW / 2 + e * 2, p.y);
      ctx.lineTo(p.x, p.y + TH / 2 + e);
      ctx.lineTo(p.x - TW / 2 - e * 2, p.y);
      ctx.closePath();
      ctx.fill();

      if (tile.type === 'water') { drawWaterDetails(x, y, tile); return; }
      if (!tile.decor || GAME.camera.zoom < DETAIL_ZOOM) return;

      const at = (d) => ({ x: p.x + (d.u - d.v) * 32, y: p.y + (d.u + d.v) * 16 });

      // Grass tufts: batched into two paths (shadow blades + lit blades)
      const tufts = tile.decor.filter(d => d.k === 'tuft');
      if (tufts.length) {
        const dark = tile.type === 'forest' ? '#2e5a22' : '#44782c';
        const light = tile.type === 'forest' ? '#5e9a40' : '#9ccc62';
        ctx.lineWidth = 1;
        ctx.strokeStyle = dark;
        ctx.beginPath();
        for (const d of tufts) {
          const q = at(d);
          ctx.moveTo(q.x - 2.5 * d.s, q.y); ctx.lineTo(q.x - 3.5 * d.s, q.y - 4 * d.s);
          ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - 0.5 * d.s, q.y - 5.5 * d.s);
        }
        ctx.stroke();
        ctx.strokeStyle = light;
        ctx.beginPath();
        for (const d of tufts) {
          const q = at(d);
          ctx.moveTo(q.x + 1, q.y); ctx.lineTo(q.x + 2.5 * d.s, q.y - 4.5 * d.s);
          ctx.moveTo(q.x + 2.5 * d.s, q.y); ctx.lineTo(q.x + 4 * d.s, q.y - 3 * d.s);
        }
        ctx.stroke();
      }

      for (const d of tile.decor) {
        if (d.k === 'tuft') continue;
        const q = at(d);
        if (d.k === 'flower') {
          line(q, { x: q.x, y: q.y - 3 }, '#3e7228', 0.8);
          dot({ x: q.x, y: q.y - 3.5 }, 1.5, d.c);
          dot({ x: q.x, y: q.y - 3.5 }, 0.5, '#f8e070');
        } else if (d.k === 'pebble') {
          ctx.fillStyle = '#9a968a';
          ctx.beginPath(); ctx.ellipse(q.x, q.y, 2.2, 1.3, 0, 0, Math.PI * 2); ctx.fill();
          dot({ x: q.x + 0.6, y: q.y - 0.4 }, 0.8, '#c4c0b4');
        } else if (d.k === 'speck') {
          dot(q, 0.8, d.c);
        } else if (d.k === 'stump') {
          ctx.fillStyle = '#5a3c20';
          ctx.fillRect(q.x - 2.2, q.y - 3, 4.4, 3);
          ctx.fillStyle = '#c8a070';
          ctx.beginPath(); ctx.ellipse(q.x, q.y - 3, 2.2, 1.1, 0, 0, Math.PI * 2); ctx.fill();
        } else if (d.k === 'shell') {
          ctx.fillStyle = '#f8ece0';
          ctx.beginPath(); ctx.arc(q.x, q.y, 1.8, Math.PI, 0); ctx.fill();
        }
      }
    }

    // Stone quay along the edge of a canal tile that faces direction (dx, dy)
    function drawQuay(x, y, dx, dy) {
      const [[u0, v0], [u1, v1]] = SHORE_EDGES[`${dx},${dy}`];
      const a = P(x + u0, y + v0, 2), b = P(x + u1, y + v1, 2);
      const a2 = P(x + u0 * 0.78, y + v0 * 0.78, 0), b2 = P(x + u1 * 0.78, y + v1 * 0.78, 0);
      poly('#aaa496', [a, b, b2, a2], 'rgba(60,54,44,0.5)');
      for (let i = 1; i < 4; i++) line(lerp(a, b, i / 4), lerp(a2, b2, i / 4), 'rgba(60,54,44,0.35)', 0.6);
    }

    function drawWaterDetails(x, y, tile) {
      const t = animTime / 1000;
      // Canals have stone quays instead of foam
      if (tile.canal && tile.landDirs) {
        for (const [dx, dy] of tile.landDirs) drawQuay(x, y, dx, dy);
      } else if (tile.shore) {
        // Foam along edges that touch land, gently pulsing
        const a = 0.45 + 0.2 * Math.sin(t * 2 + x * 0.7 + y * 0.5);
        ctx.strokeStyle = `rgba(236,248,255,${a.toFixed(2)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (const [[u0, v0], [u1, v1]] of tile.shore) {
          const a0 = P(x + u0 * 0.86, y + v0 * 0.86), a1 = P(x + u1 * 0.86, y + v1 * 0.86);
          ctx.moveTo(a0.x, a0.y);
          ctx.lineTo(a1.x, a1.y);
        }
        ctx.stroke();
      }
      // Glinting wave crests that fade in and out
      if (tile.wave && GAME.camera.zoom >= WAVE_ZOOM) {
        const w = tile.wave, ph = t * 1.3 + w.ph;
        const alpha = (Math.sin(ph) + 1) / 2 * 0.55;
        if (alpha > 0.05) {
          const q = P(x + w.u, y + w.v), off = Math.sin(ph * 0.5) * 2.5;
          ctx.strokeStyle = `rgba(200,236,252,${alpha.toFixed(2)})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(q.x - 7 + off, q.y);
          ctx.quadraticCurveTo(q.x + off, q.y - 3, q.x + 7 + off, q.y);
          ctx.stroke();
        }
      }
    }

    // ----- Trees -----
    // Deciduous canopy made of overlapping blobs [dx, dy, r] around the crown centre
    const CANOPY = [[-6, 2, 7], [6, 2, 7], [0, -4, 8.5], [-3.5, -9, 6], [4, -8.5, 6]];

    // Trees are drawn once per variant into an offscreen sprite (vector detail is too costly
    // for thousands of trees per frame) and then blitted with drawImage.
    const TREE_SPRITE = { w: 36, h: 48, ax: 18, ay: 42, res: 2.5 }; // size/anchor in tree px, render scale
    const treeSprites = new Map();

    function treeSprite(tr) {
      let spr = treeSprites.get(tr.key);
      if (spr) return spr;
      spr = document.createElement('canvas');
      spr.width = TREE_SPRITE.w * TREE_SPRITE.res;
      spr.height = TREE_SPRITE.h * TREE_SPRITE.res;
      const mainCtx = ctx;
      ctx = spr.getContext('2d');
      try {
        ctx.scale(TREE_SPRITE.res, TREE_SPRITE.res);
        drawTreeVector(TREE_SPRITE.ax, TREE_SPRITE.ay, { ...tr, s: 1 });
      } finally {
        ctx = mainCtx;
      }
      treeSprites.set(tr.key, spr);
      return spr;
    }

    function drawTreeAt(u, v, tr) {
      const b = P(u, v, 0), s = tr.s, spr = treeSprite(tr);
      ctx.drawImage(spr, b.x - TREE_SPRITE.ax * s, b.y - TREE_SPRITE.ay * s, TREE_SPRITE.w * s, TREE_SPRITE.h * s);
    }

    // Full vector tree with its base at screen point (bx, by)
    function drawTreeVector(bx, by, tr) {
      const b = { x: bx, y: by }, s = tr.s;

      // Shadow falls to the left (light comes from the right)
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(b.x - 5 * s, b.y + 1, 11 * s, 4.5 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      if (tr.conifer) {
        ctx.fillStyle = '#5a3a1e';
        ctx.fillRect(b.x - 1.3 * s, b.y - 7 * s, 2.6 * s, 7 * s);
        for (let i = 0; i < 3; i++) {
          const w = (10 - i * 2.6) * s, yb = b.y - (5 + i * 7.5) * s, yt = yb - 13 * s;
          const tip = { x: b.x, y: yt };
          const L = { x: b.x - w, y: yb }, R = { x: b.x + w, y: yb }, M = { x: b.x, y: yb + 2.5 * s };
          poly(tr.dark, [L, M, tip], null);  // shaded half
          poly(tr.light, [M, R, tip], null); // lit half
          poly(null, [L, M, R, tip], 'rgba(20,40,20,0.55)');
        }
        return;
      }

      // Trunk: tapered, lit on the right
      poly('#5e3c1e', [{ x: b.x - 2.2 * s, y: b.y }, { x: b.x + 2.2 * s, y: b.y }, { x: b.x + 1.2 * s, y: b.y - 13 * s }, { x: b.x - 1.2 * s, y: b.y - 13 * s }], null);
      poly('#7a5230', [{ x: b.x, y: b.y }, { x: b.x + 2.2 * s, y: b.y }, { x: b.x + 1.2 * s, y: b.y - 13 * s }, { x: b.x, y: b.y - 13 * s }], null);

      const cx = b.x, cy = b.y - 21 * s;

      // Draw each layer as one batched path: outline → shadow tone → mid tone → highlights
      const blobs = (grow, ox, oy, rs, color, list = CANOPY) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        for (const [dx, dy, r] of list) {
          const X = cx + (dx + ox) * s, Y = cy + (dy + oy) * s, R = r * s * rs + grow;
          ctx.moveTo(X + R, Y);
          ctx.arc(X, Y, R, 0, Math.PI * 2);
        }
        ctx.fill();
      };
      blobs(1.2, 0, 0, 1, 'rgba(20,40,16,0.6)');
      blobs(0, 0, 0, 1, tr.dark);
      blobs(0, 1.6, -1.6, 0.72, tr.mid);
      blobs(0, 2.6, -2.8, 0.34, tr.light, CANOPY.slice(1, 5));
    }

    // Trees are drawn according to how much wood is left: felled trees disappear,
    // a regrowing tree starts as a small sapling and grows to full size
    function drawForest(x, y, tile) {
      const wood = tile.wood ?? tile.woodMax;
      tile.trees.forEach((tr, i) => {
        const frac = Math.min(1, (wood - i * WOOD_PER_TREE) / WOOD_PER_TREE);
        if (frac <= 0.05) return;
        drawTreeAt(x + tr.u, y + tr.v, frac >= 1 ? tr : { ...tr, s: tr.s * (0.3 + 0.7 * frac) });
      });
    }

    // ===== BUILDING RENDERING =====
    // Everything is drawn procedurally in a small 3D iso space:
    // u/v in tile units (tile centres at integers), z in screen pixels.
    // Visible walls are the front-left (plane v = const) and front-right (plane u = const).
    // Light comes from the right, so front-right faces are lit and front-left faces are shaded.
    const P = (u, v, z = 0) => ({ x: (u - v) * 32, y: (u + v) * 16 - z });
    const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    const OUTLINE = 'rgba(35,22,10,0.6)';
    const TILE_PX = 36; // approx. screen length of one tile edge, used for round shapes

    function shade(hex, f) {
      const n = parseInt(hex.slice(1), 16);
      const c = (v) => Math.min(255, Math.round(v * f));
      return `rgb(${c((n >> 16) & 255)},${c((n >> 8) & 255)},${c(n & 255)})`;
    }

    // Deterministic per-building randomness so details don't flicker between frames
    function seeded(seed) {
      let s = seed >>> 0 || 1;
      return () => {
        s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
        return (s >>> 0) / 4294967296;
      };
    }

    function poly(fill, pts, stroke = OUTLINE) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 0.8; ctx.stroke(); }
    }

    function line(a, b, color, w = 1) {
      ctx.strokeStyle = color;
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    function dot(p, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Wall faces. at(s, t): s = tiles along the wall (left → right on screen), t = pixels up.
    const wallL = (u0, u1, v, z0, z1) => ({ len: u1 - u0, h: z1 - z0, at: (s, t) => P(u0 + s, v, z0 + t) });
    const wallR = (u, v0, v1, z0, z1) => ({ len: v1 - v0, h: z1 - z0, at: (s, t) => P(u, v1 - s, z0 + t) });
    const rectOn = (f, s0, t0, s1, t1) => [f.at(s0, t0), f.at(s1, t0), f.at(s1, t1), f.at(s0, t1)];

    function walls(u0, v0, u1, v1, z0, z1, color, top) {
      const L = wallL(u0, u1, v1, z0, z1), R = wallR(u1, v0, v1, z0, z1);
      poly(shade(color, 0.78), rectOn(L, 0, 0, L.len, L.h));
      poly(color, rectOn(R, 0, 0, R.len, R.h));
      if (top) poly(top, [P(u0, v0, z1), P(u1, v0, z1), P(u1, v1, z1), P(u0, v1, z1)]);
      return { L, R };
    }

    // --- Wall surface details ---
    function boards(f, spacing = 0.08) {
      const n = Math.max(1, Math.round(f.len / spacing));
      for (let i = 1; i < n; i++) line(f.at(f.len * i / n, 0), f.at(f.len * i / n, f.h), 'rgba(0,0,0,0.22)', 0.7);
    }

    function logCourses(f, n) {
      for (let i = 1; i < n; i++) line(f.at(0, f.h * i / n), f.at(f.len, f.h * i / n), 'rgba(30,15,5,0.45)', 1);
    }

    function stones(f) {
      const rows = Math.max(1, Math.round(f.h / 4));
      for (let r = 0; r < rows; r++) {
        const t0 = f.h * r / rows, t1 = f.h * (r + 1) / rows;
        if (r > 0) line(f.at(0, t0), f.at(f.len, t0), 'rgba(0,0,0,0.25)', 0.6);
        for (let s = (r % 2) * 0.07 + 0.07; s < f.len; s += 0.14) line(f.at(s, t0), f.at(s, t1), 'rgba(0,0,0,0.2)', 0.6);
      }
    }

    // Half-timbering: sill, header, posts and alternating braces
    function timber(f, color = '#4a3020', spacing = 0.28) {
      const n = Math.max(1, Math.round(f.len / spacing));
      for (let i = 0; i < n; i++) {
        const a = f.len * i / n, b = f.len * (i + 1) / n;
        if (i % 2) line(f.at(a, 0), f.at(b, f.h), color, 1);
        else line(f.at(b, 0), f.at(a, f.h), color, 1);
      }
      for (let i = 0; i <= n; i++) line(f.at(f.len * i / n, 0), f.at(f.len * i / n, f.h), color, 1.4);
      line(f.at(0, 0.7), f.at(f.len, 0.7), color, 1.6);
      line(f.at(0, f.h - 0.7), f.at(f.len, f.h - 0.7), color, 1.6);
    }

    function win(f, s, t, ws, ht, opts = {}) {
      const a = s - ws / 2, b = s + ws / 2;
      poly('#3a2616', rectOn(f, a - 0.015, t - 1, b + 0.015, t + ht + 1), null);
      poly(opts.lit ? '#f0d890' : '#5e7e9c', rectOn(f, a, t, b, t + ht), null);
      line(f.at(s, t), f.at(s, t + ht), '#3a2616', 0.8);
      line(f.at(a, t + ht / 2), f.at(b, t + ht / 2), '#3a2616', 0.8);
      if (opts.shutter) {
        const sw = ws * 0.45;
        poly(opts.shutter, rectOn(f, a - sw - 0.01, t, a - 0.01, t + ht));
        poly(opts.shutter, rectOn(f, b + 0.01, t, b + sw + 0.01, t + ht));
      }
      if (opts.flowers) {
        poly('#5a3a1a', rectOn(f, a - 0.02, t - 3, b + 0.02, t - 1));
        for (let i = 0; i < 3; i++) dot(f.at(a + ws * (i + 0.5) / 3, t - 0.5), 1.1, i % 2 ? '#e05050' : '#f0c040');
      }
    }

    function door(f, s, ws, ht, color = '#5a3a1a') {
      poly('#2e1c0c', rectOn(f, s - ws / 2 - 0.015, 0, s + ws / 2 + 0.015, ht + 1), null);
      poly(color, rectOn(f, s - ws / 2, 0, s + ws / 2, ht));
      line(f.at(s - ws / 6, 0), f.at(s - ws / 6, ht), 'rgba(0,0,0,0.3)', 0.6);
      line(f.at(s + ws / 6, 0), f.at(s + ws / 6, ht), 'rgba(0,0,0,0.3)', 0.6);
      dot(f.at(s + ws / 3, ht * 0.45), 0.8, '#d8b060');
    }

    // Large arched double door (barns, warehouses)
    function barnDoor(f, s, ws, ht) {
      const a = s - ws / 2, b = s + ws / 2, arch = ws * 14;
      const outline = [f.at(a, 0), f.at(b, 0)];
      for (let i = 0; i <= 8; i++) {
        const ang = (i / 8) * Math.PI;
        outline.push(f.at(s + Math.cos(ang) * ws / 2, ht + Math.sin(ang) * arch));
      }
      poly('#4e3014', outline);
      line(f.at(s, 0), f.at(s, ht + arch), '#2e1c0c', 1);
      line(f.at(a, ht * 0.15), f.at(s, ht * 0.85), 'rgba(0,0,0,0.35)', 1);
      line(f.at(b, ht * 0.15), f.at(s, ht * 0.85), 'rgba(0,0,0,0.35)', 1);
      line(f.at(a, ht * 0.5), f.at(b, ht * 0.5), 'rgba(0,0,0,0.35)', 0.8);
    }

    // --- Roofs ---
    function roofTexture(q, col, style) {
      const [A, B, C, D] = q;
      if (style === 'thatch') {
        for (let i = 1; i < 5; i++) line(lerp(A, D, i / 5), lerp(B, C, i / 5), shade(col, 0.72), 1.2);
        line(A, B, shade(col, 0.6), 2.2);
      } else {
        const rows = style === 'shingle' ? 6 : 5;
        for (let i = 1; i < rows; i++) line(lerp(A, D, i / rows), lerp(B, C, i / rows), shade(col, 0.62), 0.8);
        const len = Math.hypot(B.x - A.x, B.y - A.y);
        const cols = Math.max(3, Math.round(len / (style === 'shingle' ? 6 : 4.5)));
        for (let j = 1; j < cols; j++) line(lerp(A, B, j / cols), lerp(D, C, j / cols), shade(col, 0.8), 0.5);
      }
      line(D, C, shade(col, 0.5), 2); // ridge
    }

    function gableDeco(g, opts) {
      if (opts.timber) {
        const c = opts.timber;
        line(g.at(g.len / 2, 0), g.at(g.len / 2, g.h), c, 1.4);
        line(g.at(g.len * 0.25, g.h * 0.5), g.at(g.len * 0.75, g.h * 0.5), c, 1.2);
        line(g.at(0, 0.6), g.at(g.len, 0.6), c, 1.6);
      }
      if (opts.boards) boards(g, 0.08);
      if (opts.vent) {
        const w = opts.vent;
        poly('#2e1c0c', rectOn(g, g.len / 2 - w / 2, g.h * 0.22, g.len / 2 + w / 2, g.h * 0.22 + w * 30));
      }
    }

    // Gable roof with ridge along u; the visible gable end faces +u (front-right)
    function roofU(u0, v0, u1, v1, z, rh, col, gable, opts = {}) {
      const o = 0.09, vm = (v0 + v1) / 2, a = u0 - o, b = u1 + o;
      poly(shade(col, 0.7), [P(a, v0 - o, z), P(b, v0 - o, z), P(b, vm, z + rh), P(a, vm, z + rh)]);
      if (gable) {
        const g = wallR(u1, v0, v1, z, z + rh);
        poly(gable, [g.at(0, 0), g.at(g.len, 0), g.at(g.len / 2, rh)]);
        ctx.save();
        ctx.beginPath();
        const tri = [g.at(0, 0), g.at(g.len, 0), g.at(g.len / 2, rh)];
        ctx.moveTo(tri[0].x, tri[0].y); ctx.lineTo(tri[1].x, tri[1].y); ctx.lineTo(tri[2].x, tri[2].y);
        ctx.clip();
        gableDeco(g, opts);
        ctx.restore();
      }
      const front = [P(a, v1 + o, z), P(b, v1 + o, z), P(b, vm, z + rh), P(a, vm, z + rh)];
      poly(shade(col, 0.88), front);
      roofTexture(front, col, opts.style);
      const verge = shade(col, 0.45);
      line(P(b, v0 - o, z), P(b, vm, z + rh), verge, 1.6);
      line(P(b, vm, z + rh), P(b, v1 + o, z), verge, 1.6);
      // Surface height at a given v, for placing chimneys
      return (v) => z + rh * (1 - Math.abs(v - vm) / (vm - v0 + o));
    }

    // Gable roof with ridge along v; the visible gable end faces +v (front-left)
    function roofV(u0, v0, u1, v1, z, rh, col, gable, opts = {}) {
      const o = 0.09, um = (u0 + u1) / 2, a = v0 - o, b = v1 + o;
      poly(shade(col, 0.7), [P(u0 - o, b, z), P(u0 - o, a, z), P(um, a, z + rh), P(um, b, z + rh)]);
      if (gable) {
        const g = wallL(u0, u1, v1, z, z + rh);
        const tri = [g.at(0, 0), g.at(g.len, 0), g.at(g.len / 2, rh)];
        poly(shade(gable, 0.78), tri);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(tri[0].x, tri[0].y); ctx.lineTo(tri[1].x, tri[1].y); ctx.lineTo(tri[2].x, tri[2].y);
        ctx.clip();
        gableDeco(g, opts);
        ctx.restore();
      }
      const front = [P(u1 + o, b, z), P(u1 + o, a, z), P(um, a, z + rh), P(um, b, z + rh)];
      poly(col, front);
      roofTexture(front, col, opts.style);
      const verge = shade(col, 0.45);
      line(P(u0 - o, b, z), P(um, b, z + rh), verge, 1.6);
      line(P(um, b, z + rh), P(u1 + o, b, z), verge, 1.6);
      return (u) => z + rh * (1 - Math.abs(u - um) / (um - u0 + o));
    }

    // --- Props ---
    function smoke(p, seed = 0) {
      for (let i = 0; i < 4; i++) {
        const t = (animTime / 2600 + i / 4 + seed) % 1;
        ctx.fillStyle = `rgba(225,225,225,${0.5 * (1 - t)})`;
        ctx.beginPath();
        ctx.arc(p.x + Math.sin(t * 5 + i) * 2 + t * 8, p.y - 2 - t * 30, 2 + t * 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function chimney(u, v, z0, z1, seed) {
      const c = walls(u - 0.06, v - 0.06, u + 0.06, v + 0.06, z0, z1, '#9a8a78', '#4a3a2a');
      stones(c.L); stones(c.R);
      smoke(P(u, v, z1), seed);
    }

    function cylinder(u, v, z, r, h, side, top) {
      const b = P(u, v, z), t = P(u, v, z + h), rx = r * 45, ry = r * 22.6;
      ctx.fillStyle = side;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, rx, ry, 0, 0, Math.PI);
      ctx.lineTo(t.x - rx, t.y);
      ctx.lineTo(t.x + rx, t.y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = OUTLINE; ctx.lineWidth = 0.8; ctx.stroke();
      ctx.fillStyle = top;
      ctx.beginPath();
      ctx.ellipse(t.x, t.y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      return { b, t, rx, ry };
    }

    function barrel(u, v, z = 0) {
      const c = cylinder(u, v, z, 0.085, 11, '#8a5226', '#a8703c');
      ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 1;
      for (const k of [0.25, 0.75]) {
        ctx.beginPath();
        ctx.ellipse(c.b.x, c.b.y - 11 * k, c.rx, c.ry, 0, 0, Math.PI);
        ctx.stroke();
      }
    }

    function crate(u, v, s, z = 0) {
      const c = walls(u - s, v - s, u + s, v + s, z, z + s * 50, '#a67c44', '#c49a5c');
      for (const f of [c.L, c.R]) {
        line(f.at(0, 0), f.at(f.len, f.h), 'rgba(60,35,10,0.6)', 0.9);
        line(f.at(0, f.h), f.at(f.len, 0), 'rgba(60,35,10,0.6)', 0.9);
      }
    }

    function sack(u, v, z = 0) {
      const p = P(u, v, z + 4);
      ctx.fillStyle = '#d6c69a';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 6, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = OUTLINE; ctx.lineWidth = 0.8; ctx.stroke();
      dot({ x: p.x, y: p.y - 4 }, 1.5, '#a8966a');
    }

    // Stack of logs lying along u; the cut ends face +u
    function logPile(u0, v0, u1, v1, rows) {
      const d = (v1 - v0) / rows, rpx = d * TILE_PX * 0.38;
      const logs = [];
      for (let r = 0; r < rows; r++) {
        for (let k = 0; k < rows - r; k++) {
          logs.push({ vc: v1 - d / 2 - r * d / 2 - k * d, zc: rpx + r * rpx * 1.7 });
        }
      }
      logs.sort((a, b) => a.vc - b.vc || a.zc - b.zc);
      for (const l of logs) {
        poly('#6a4422', [P(u0, l.vc, l.zc - rpx), P(u1, l.vc, l.zc - rpx), P(u1, l.vc, l.zc + rpx), P(u0, l.vc, l.zc + rpx)]);
        const e = P(u1, l.vc, l.zc);
        dot(e, rpx, '#d8b07a');
        ctx.strokeStyle = '#8a6030'; ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.arc(e.x, e.y, rpx, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(e.x, e.y, rpx * 0.5, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // Log lying along u (e.g. on a saw bench)
    function logBand(u0, u1, vc, zc, rpx) {
      poly('#6a4422', [P(u0, vc, zc - rpx), P(u1, vc, zc - rpx), P(u1, vc, zc + rpx), P(u0, vc, zc + rpx)]);
      dot(P(u1, vc, zc), rpx, '#d8b07a');
    }

    function plankStack(u0, v0, u1, v1, n) {
      for (let i = 0; i < n; i++) {
        const j = (i % 2) * 0.03;
        const p = walls(u0 + j, v0, u1 + j, v1, i * 3, i * 3 + 2.6, '#cfa25c', '#e6c27e');
        boards(p.R, 0.07);
      }
    }

    function post(u, v, h, color = '#5a3a1e') {
      walls(u - 0.03, v - 0.03, u + 0.03, v + 0.03, 0, h, color, shade(color, 1.2));
    }

    function fence(u0, v0, u1, v1) {
      const len = Math.hypot(u1 - u0, v1 - v0), n = Math.max(1, Math.round(len / 0.14));
      line(P(u0, v0, 3), P(u1, v1, 3), '#7a5a32', 1);
      line(P(u0, v0, 6.5), P(u1, v1, 6.5), '#7a5a32', 1);
      for (let i = 0; i <= n; i++) {
        const u = u0 + (u1 - u0) * i / n, v = v0 + (v1 - v0) * i / n;
        line(P(u, v, 0), P(u, v, 8), '#5a3e20', 1.5);
      }
    }

    function bush(u, v, r, color = '#3e7a2e') {
      const p = P(u, v, r * 14);
      dot({ x: p.x + 1, y: p.y + 2 }, r * 16, 'rgba(0,0,0,0.2)');
      dot(p, r * 16, color);
      dot({ x: p.x - r * 5, y: p.y - r * 5 }, r * 9, shade(color, 1.25));
    }

    function tree(u, v, s = 1) {
      const b = P(u, v, 0);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, 9 * s, 4.5 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6b4423';
      ctx.fillRect(b.x - 1.5 * s, b.y - 12 * s, 3 * s, 12 * s);
      dot({ x: b.x, y: b.y - 16 * s }, 8 * s, '#2e6420');
      dot({ x: b.x - 3 * s, y: b.y - 22 * s }, 6 * s, '#3a7a2a');
      dot({ x: b.x + 3 * s, y: b.y - 19 * s }, 5 * s, '#4a8a34');
    }

    function stumpWithAxe(u, v) {
      const c = cylinder(u, v, 0, 0.09, 6, '#6a4422', '#d8b07a');
      ctx.strokeStyle = '#a8804a'; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.ellipse(c.t.x, c.t.y, c.rx * 0.5, c.ry * 0.5, 0, 0, Math.PI * 2); ctx.stroke();
      const h0 = { x: c.t.x - 1, y: c.t.y }, h1 = { x: c.t.x + 6, y: c.t.y - 11 };
      line(h0, h1, '#8a6034', 1.6);
      poly('#b8bcc0', [{ x: h0.x - 3, y: h0.y - 1 }, { x: h0.x + 3, y: h0.y - 3 }, { x: h0.x + 2, y: h0.y + 1 }, { x: h0.x - 3, y: h0.y + 2 }]);
    }

    function flag(u, v, z, h, color) {
      const base = P(u, v, z), top = P(u, v, z + h);
      line(base, top, '#4a3a2a', 1.5);
      const n = 6, len = 15, fh = 9, pts = [];
      const wave = (i) => Math.sin(animTime / 260 + i * 0.9) * 2 * (i / n);
      for (let i = 0; i <= n; i++) pts.push({ x: top.x + len * i / n, y: top.y + 1 + wave(i) });
      for (let i = n; i >= 0; i--) pts.push({ x: top.x + len * i / n, y: top.y + 1 + fh + wave(i) });
      poly(color, pts);
      dot(top, 1.5, '#e8c040');
    }

    function sawBlade(uc, vc, zc, r) {
      const rot = animTime / 90, teeth = 14, pts = [];
      for (let i = 0; i < teeth * 2; i++) {
        const a = rot + i * Math.PI / teeth, rr = i % 2 ? r : r * 1.14;
        pts.push(P(uc + rr * Math.cos(a), vc, zc + rr * TILE_PX * Math.sin(a)));
      }
      poly('#c8ccd2', pts, '#5a5e64');
      const hub = [];
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI / 5;
        hub.push(P(uc + r * 0.28 * Math.cos(a), vc, zc + r * 0.28 * TILE_PX * Math.sin(a)));
      }
      poly('#5a5e64', hub, null);
    }

    // Plot of trodden ground under a building
    function ground(U, V, W, H, color, rnd, specks = '#6a5a3a') {
      const i = 0.04;
      poly(color, [P(U + i, V + i), P(U + W - i, V + i), P(U + W - i, V + H - i), P(U + i, V + H - i)], 'rgba(0,0,0,0.15)');
      for (let k = 0; k < W * H * 6; k++) dot(P(U + 0.1 + rnd() * (W - 0.2), V + 0.1 + rnd() * (H - 0.2)), 0.9, specks);
    }

    // Soft contact shadow under a block
    function ao(u0, v0, u1, v1) {
      poly('rgba(0,0,0,0.28)', [P(u0 - 0.04, v0 - 0.04), P(u1 + 0.12, v0 - 0.04), P(u1 + 0.12, v1 + 0.12), P(u0 - 0.04, v1 + 0.12)], null);
    }

    // --- Buildings ---
    // Pioneer hut: plank walls and a thatched roof
    function drawHouseSmall(U, V, rnd, vr) {
      ground(U, V, 1, 1, '#8a7a55', rnd);
      const u0 = U + 0.24, u1 = U + 0.78, v0 = V + 0.22, v1 = V + 0.76, wh = 12;
      const wall = ['#9a7048', '#8e6842', '#a47a4e'][vr % 3];
      ao(u0, v0, u1, v1);
      const { L, R } = walls(u0, v0, u1, v1, 0, wh, wall);
      boards(L, 0.07); boards(R, 0.07);
      door(L, L.len * 0.55, 0.14, 9);
      win(R, R.len * 0.5, 4, 0.12, 4);
      roofV(u0, v0, u1, v1, wh, 15, '#c9a24e', wall, { style: 'thatch', boards: true });
      logPile(U + 0.83, V + 0.28, U + 0.95, V + 0.64, 2);
    }

    // Settler house: stone plinth, two half-timbered storeys, tiled roof, chimney and garden
    function drawHouseMedium(U, V, rnd, vr) {
      ground(U, V, 2, 2, '#8a7a55', rnd);
      const roof = ['#b0442e', '#9c3a28', '#a85236', '#7e4a3a'][vr % 4];
      const shutter = ['#3a6a3a', '#2e5a7a', '#7a3a2a'][vr % 3];
      const plaster = '#ece0c4';

      // Garden in front
      poly('#6a9a42', [P(U + 0.3, V + 1.45), P(U + 1.75, V + 1.45), P(U + 1.75, V + 1.88), P(U + 0.3, V + 1.88)], null);
      for (let k = 0; k < 14; k++) {
        dot(P(U + 0.4 + rnd() * 1.25, V + 1.52 + rnd() * 0.3, 1), 1.2, ['#e05050', '#f0c040', '#e8e8f0', '#c060c0'][k % 4]);
      }

      const u0 = U + 0.25, u1 = U + 1.55, v0 = V + 0.2, v1 = V + 1.22;
      ao(u0, v0, u1, v1 + 0.04);
      const pl = walls(u0, v0, u1, v1, 0, 5, '#8c867a');
      stones(pl.L); stones(pl.R);
      const g = walls(u0, v0, u1, v1, 5, 19, plaster);
      timber(g.L); timber(g.R);
      // Upper storey juts out slightly, as in real timber-framed houses
      const f1 = walls(u0, v0, u1 + 0.04, v1 + 0.04, 19, 33, plaster);
      timber(f1.L); timber(f1.R);

      const dw = wallL(u0, u1, v1, 0, 19);
      door(dw, 0.72, 0.18, 15);
      walls(u0 + 0.6, v1, u0 + 0.84, v1 + 0.08, 0, 2, '#8c867a', '#a8a294');
      for (const s of [0.3, 1.1]) win(g.L, s, 4, 0.14, 7, { shutter });
      for (const s of [0.28, 0.72, 1.12]) win(f1.L, s, 4, 0.14, 7, { shutter, flowers: s !== 0.72 });
      for (const s of [0.28, 0.74]) { win(g.R, s, 4, 0.14, 7, { shutter }); win(f1.R, s, 4, 0.14, 7, { shutter }); }

      const surf = roofU(u0, v0, u1 + 0.04, v1 + 0.04, 33, 24, roof, plaster, { style: 'tile', timber: '#4a3020', vent: 0.12 });
      const cv = (v0 + v1) / 2 + 0.22;
      chimney(u0 + 0.35, cv, surf(cv + 0.06) - 2, surf(cv) + 16, vr * 0.13);

      barrel(u0 + 0.42, v1 + 0.16);
      bush(U + 1.8, V + 0.5, 0.35);
      bush(U + 1.78, V + 1.0, 0.28, '#4a8a36');
      fence(U + 0.25, V + 1.92, U + 1.82, V + 1.92);
      fence(U + 1.82, V + 1.4, U + 1.82, V + 1.92);
    }

    // Lumberjack's hut: log cabin, shingle roof, log pile and chopping block
    function drawWoodcutter(U, V, rnd) {
      ground(U, V, 2, 2, '#7a6a48', rnd, '#c8a86a');
      bush(U + 0.2, V + 1.75, 0.3);
      const u0 = U + 0.15, u1 = U + 1.05, v0 = V + 0.15, v1 = V + 1.0, wh = 15;
      ao(u0, v0, u1, v1);
      const w = walls(u0, v0, u1, v1, 0, wh, '#8a5a30');
      logCourses(w.L, 5); logCourses(w.R, 5);
      for (let i = 0; i < 5; i++) dot(w.L.at(w.L.len, (i + 0.5) * wh / 5), 1.7, '#c89a60');
      door(w.L, 0.5, 0.16, 11, '#4a2a12');
      win(w.R, 0.42, 5, 0.14, 5, { shutter: '#5a3a1a' });
      const surf = roofV(u0, v0, u1, v1, wh, 17, '#6e5a48', '#8a5a30', { style: 'shingle', boards: true });
      const cu = (u0 + u1) / 2 + 0.2;
      chimney(cu, v0 + 0.3, surf(cu + 0.06) - 2, surf(cu) + 12, 0.4);

      logPile(U + 1.2, V + 0.18, U + 1.85, V + 0.95, 3);
      stumpWithAxe(U + 0.75, V + 1.4);
      logBand(U + 0.95, U + 1.35, V + 1.62, 2.5, 2.5);
      tree(U + 1.65, V + 1.62, 0.8);
    }

    // Sawmill: timber hall, open saw shed with a spinning blade, plank and log stacks
    function drawSawmill(U, V, rnd) {
      ground(U, V, 3, 2, '#7a6a48', rnd, '#d8b878');
      poly('#c8a86a', [P(U + 1.8, V + 0.5), P(U + 2.9, V + 0.5), P(U + 2.9, V + 1.4), P(U + 1.8, V + 1.4)], null);

      // Main hall
      const u0 = U + 0.15, u1 = U + 1.65, v0 = V + 0.15, v1 = V + 1.2;
      ao(u0, v0, u1, v1);
      const pl = walls(u0, v0, u1, v1, 0, 5, '#8c867a');
      stones(pl.L); stones(pl.R);
      const w = walls(u0, v0, u1, v1, 5, 24, '#9a6a3a');
      boards(w.L, 0.09); boards(w.R, 0.09);
      line(w.L.at(0, w.h - 0.7), w.L.at(w.L.len, w.h - 0.7), '#4a3020', 1.6);
      line(w.R.at(0, w.h - 0.7), w.R.at(w.R.len, w.h - 0.7), '#4a3020', 1.6);
      barnDoor(wallL(u0, u1, v1, 0, 24), 0.5, 0.4, 13);
      win(w.L, 1.15, 8, 0.16, 7, { shutter: '#5a3a1a' });
      for (const s of [0.3, 0.75]) win(w.R, s, 8, 0.14, 7, { shutter: '#5a3a1a' });
      roofU(u0, v0, u1, v1, 24, 20, '#5e4e46', '#9a6a3a', { style: 'shingle', boards: true, vent: 0.14 });

      // Open saw shed
      // Roof is kept high and the bench near the front so the blade stays visible under the eave
      const s0 = U + 1.85, s1 = U + 2.85, t0 = V + 0.5, t1 = V + 1.3, ph = 34, bv = t0 + 0.6;
      logPile(U + 1.9, V + 0.06, U + 2.85, V + 0.44, 2);
      post(s0, t0, ph); post(s1, t0, ph);
      walls(s0 + 0.1, bv - 0.12, s1 - 0.1, bv + 0.12, 0, 7, '#7a5030', '#9a7048');
      logBand(s0 + 0.12, s0 + 0.5, bv, 10, 3);
      sawBlade(s0 + 0.55, bv, 12, 0.22);
      poly('#e6c27e', [P(s0 + 0.62, bv - 0.06, 7), P(s1 - 0.12, bv - 0.06, 7), P(s1 - 0.12, bv + 0.06, 7), P(s0 + 0.62, bv + 0.06, 7)]);
      post(s0, t1, ph); post(s1, t1, ph);
      roofU(s0 - 0.03, t0 - 0.03, s1 + 0.03, t1 + 0.03, ph, 9, '#5e4e46', null, { style: 'shingle' });

      // Finished planks out front
      plankStack(U + 0.35, V + 1.4, U + 1.05, V + 1.7, 5);
      plankStack(U + 1.2, V + 1.45, U + 1.7, V + 1.75, 3);
      barrel(U + 2.1, V + 1.7);
      crate(U + 2.4, V + 1.68, 0.1);
    }

    // Warehouse: stone base, timber barn with a big arched door, goods stacked outside
    function drawWarehouse(U, V, rnd) {
      ground(U, V, 2, 2, '#9a9282', rnd, '#7a7266');
      const u0 = U + 0.12, u1 = U + 1.4, v0 = V + 0.12, v1 = V + 1.35;
      ao(u0, v0, u1, v1);
      const base = walls(u0, v0, u1, v1, 0, 11, '#8e887c');
      stones(base.L); stones(base.R);
      const w = walls(u0, v0, u1, v1, 11, 27, '#7a5030');
      boards(w.L, 0.08); boards(w.R, 0.08);
      for (const f of [w.L, w.R]) {
        line(f.at(0, 0.7), f.at(f.len, 0.7), '#3e2614', 1.6);
        line(f.at(0, f.h - 0.7), f.at(f.len, f.h - 0.7), '#3e2614', 1.6);
      }
      barnDoor(wallL(u0, u1, v1, 0, 27), (u1 - u0) / 2, 0.44, 15);
      for (const s of [0.35, 0.9]) win(w.R, s, 5, 0.14, 7, { shutter: '#4a3018' });
      for (const s of [0.2, 1.08]) win(w.L, s, 5, 0.12, 7, { shutter: '#4a3018' });
      roofV(u0, v0, u1, v1, 27, 22, '#8a3a2a', '#7a5030', { style: 'tile', boards: true, vent: 0.16 });
      flag((u0 + u1) / 2, v1 + 0.09, 49, 18, '#2a5aa8');

      // Goods
      crate(U + 1.62, V + 0.32, 0.1);
      crate(U + 1.62, V + 0.6, 0.1);
      crate(U + 1.62, V + 0.46, 0.085, 10);
      barrel(U + 1.62, V + 0.98);
      barrel(U + 1.56, V + 1.24);
      barrel(U + 1.78, V + 1.18);
      sack(U + 0.45, V + 1.62);
      sack(U + 0.64, V + 1.68);
      sack(U + 0.54, V + 1.6, 5);
    }

    // Irregular grey boulder with a lit top face and a crack or two
    function boulder(u, v, r, rnd, z = 0) {
      const c = P(u, v, z);
      const rx = r * 45, ry = r * 26, hgt = r * 38;
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.ellipse(c.x + 2, c.y + 1, rx * 1.05, ry * 0.9, 0, 0, Math.PI * 2); ctx.fill();

      const n = 9, body = [], topFace = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const j = 0.8 + rnd() * 0.3;
        // Lower half of the ring sits on the ground, upper half is lifted to form the dome
        const lift = Math.sin(a) < 0 ? hgt * (0.55 + rnd() * 0.25) : 0;
        body.push({ x: c.x + Math.cos(a) * rx * j, y: c.y + Math.sin(a) * ry * j - lift });
      }
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2;
        topFace.push({ x: c.x - rx * 0.15 + Math.cos(a) * rx * 0.55, y: c.y - hgt * 0.72 + Math.sin(a) * ry * 0.45 });
      }
      poly('#8a867c', body, 'rgba(55,50,42,0.45)');
      poly('#aca89e', topFace, null);
      rockTexture([body], 0.8);
    }

    // Rock terrain tile: one or two boulders, stable per tile
    function drawRock(x, y, tile) {
      const rnd = seeded(Math.floor(hash2(x, y) * 1e9) + 7);
      const k = 0.4 + 0.6 * ((tile.stone ?? ROCK_STONE) / ROCK_STONE); // boulders shrink as they are quarried
      boulder(x - 0.12 + rnd() * 0.1, y - 0.1 + rnd() * 0.1, (0.26 + rnd() * 0.08) * k, rnd);
      if (rnd() < 0.6 && k > 0.6) boulder(x + 0.18, y + 0.15, (0.14 + rnd() * 0.06) * k, rnd);
    }

    // Stack of cut stone blocks (pyramid, back to front)
    function stoneBlocks(u0, v0, n) {
      const s = 0.075, step = s * 2.1, hgt = s * 44;
      for (let layer = 0; layer < n; layer++) {
        for (let i = 0; i < n - layer; i++) {
          for (let j = 0; j < n - layer; j++) {
            const u = u0 + (i + layer / 2) * step, v = v0 + (j + layer / 2) * step;
            const b = walls(u - s, v - s, u + s, v + s, layer * hgt, (layer + 1) * hgt, '#b4b0a4', '#d2cec2');
            line(b.R.at(0, b.R.h * 0.5), b.R.at(b.R.len, b.R.h * 0.5), 'rgba(0,0,0,0.12)', 0.5);
          }
        }
      }
    }

    function pickaxe(u, v) {
      const p = P(u, v, 0);
      line({ x: p.x - 7, y: p.y + 1 }, { x: p.x + 6, y: p.y - 3 }, '#8a6034', 1.6);
      ctx.strokeStyle = '#8a8e94';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(p.x + 6, p.y + 2, 5, Math.PI * 1.05, Math.PI * 1.9);
      ctx.stroke();
    }

    // Stonecutter: stone hut with tiled roof, a boulder being worked, cut blocks ready for transport
    function drawStonecutter(U, V, rnd) {
      ground(U, V, 2, 2, '#8a8270', rnd, '#b0aa9a');
      boulder(U + 1.55, V + 0.42, 0.34, rnd);
      // Chips around the worked boulder
      for (let k = 0; k < 10; k++) dot(P(U + 1.3 + rnd() * 0.55, V + 0.7 + rnd() * 0.35, 0), 1, '#c8c4b8');

      const u0 = U + 0.15, u1 = U + 1.05, v0 = V + 0.18, v1 = V + 1.02, wh = 14;
      ao(u0, v0, u1, v1);
      const w = walls(u0, v0, u1, v1, 0, wh, '#a29e90');
      stones(w.L); stones(w.R);
      door(w.L, 0.5, 0.16, 10);
      win(w.R, 0.42, 5, 0.13, 5, { shutter: '#5a4a3a' });
      const surf = roofV(u0, v0, u1, v1, wh, 16, '#9c4a30', '#a29e90', { style: 'tile', vent: 0.1 });
      const cu = (u0 + u1) / 2 + 0.2;
      chimney(cu, v0 + 0.3, surf(cu + 0.06) - 2, surf(cu) + 11, 0.7);

      stoneBlocks(U + 1.2, V + 1.12, 3);
      pickaxe(U + 0.75, V + 1.45);
      barrel(U + 0.35, V + 1.3);
    }

    // Small upturned rowing boat lying on the ground
    function rowboat(u, v, len = 0.34, wid = 0.12) {
      const ring = (z, s) => Array.from({ length: 10 }, (_, i) => {
        const a = (i / 10) * Math.PI * 2;
        return P(u + Math.cos(a) * len * s, v + Math.sin(a) * wid * s, z);
      });
      poly('#6a4424', convexHull([...ring(0, 1), ...ring(4, 0.9)]));
      poly('#9a6c3c', ring(4, 0.9));
      line(P(u - len * 0.8, v, 4.2), P(u + len * 0.8, v, 4.2), 'rgba(40,24,10,0.5)', 0.8);
    }

    // Animals: tiny side-view sprites facing left or right on screen
    function pig(u, v, face = 1) {
      const p = P(u, v, 0);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 6, 2.2, 0, 0, Math.PI * 2); ctx.fill();
      line({ x: p.x - 3, y: p.y }, { x: p.x - 3, y: p.y - 2.5 }, '#b87878', 1.2);
      line({ x: p.x + 3, y: p.y }, { x: p.x + 3, y: p.y - 2.5 }, '#b87878', 1.2);
      ctx.fillStyle = '#f2aaa2';
      ctx.beginPath(); ctx.ellipse(p.x, p.y - 4.5, 5.5, 3.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(120,60,50,0.6)'; ctx.lineWidth = 0.7; ctx.stroke();
      dot({ x: p.x + face * 5.5, y: p.y - 5 }, 2.6, '#f2aaa2');
      dot({ x: p.x + face * 7.6, y: p.y - 4.6 }, 1.2, '#dc8a82');
      dot({ x: p.x + face * 4.8, y: p.y - 7.3 }, 1, '#dc8a82');
    }

    function cow(u, v, face = 1, rnd = Math.random) {
      const p = P(u, v, 0);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 8, 2.8, 0, 0, Math.PI * 2); ctx.fill();
      for (const lx of [-4.5, -2, 2.5, 5]) line({ x: p.x + lx, y: p.y }, { x: p.x + lx, y: p.y - 4 }, '#5a4a3a', 1.3);
      ctx.fillStyle = '#f4f0e6';
      ctx.beginPath(); ctx.ellipse(p.x, p.y - 7, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(60,50,40,0.6)'; ctx.lineWidth = 0.7; ctx.stroke();
      for (let i = 0; i < 3; i++) dot({ x: p.x - 4 + rnd() * 7, y: p.y - 9 + rnd() * 4 }, 1.4 + rnd(), '#2a2622');
      dot({ x: p.x + face * 7.5, y: p.y - 8.5 }, 2.8, '#3a3230');
      line({ x: p.x + face * 6.5, y: p.y - 11 }, { x: p.x + face * 5.5, y: p.y - 13 }, '#e8e0cc', 1);
      line({ x: p.x + face * 8.5, y: p.y - 11 }, { x: p.x + face * 9.5, y: p.y - 13 }, '#e8e0cc', 1);
    }

    function hayBale(u, v, z = 0) {

    // Field of grain: soil, furrows and many small golden stalks (stable per building)
    function grainField(u0, v0, u1, v1, rnd) {
      poly('#8a6a3a', uvRect(u0, v0, u1, v1), 'rgba(60,40,20,0.4)');
      const rows = Math.round((v1 - v0) / 0.12);
      for (let r = 0; r <= rows; r++) {
        const v = v0 + (v1 - v0) * r / rows;
        line(P(u0, v), P(u1, v), '#b8943e', 1.6);
      }
      const sway = Math.sin(animTime / 900) * 0.6;
      for (const [col, dx] of [['#a8842e', -0.6], ['#f0d070', 0.6]]) {
        ctx.strokeStyle = col;
        ctx.lineWidth = 1;
        ctx.beginPath();
        const n = Math.round((u1 - u0) * (v1 - v0) * 55);
        for (let i = 0; i < n; i++) {
          const q = P(u0 + 0.04 + rnd() * (u1 - u0 - 0.08), v0 + 0.04 + rnd() * (v1 - v0 - 0.08));
          ctx.moveTo(q.x + dx, q.y);
          ctx.lineTo(q.x + dx + sway, q.y - 5 - rnd() * 2);
        }
        ctx.stroke();
      }
    }

      win(w.R, 0.4, 5, 0.13, 5, { shutter: '#3e5a6e' });
      roofV(u0, v0, u1, v1, wh, 14, '#5e6a78', '#8e6c48', { style: 'shingle', boards: true });

      post(U + 1.2, V + 0.3, 17); post(U + 1.85, V + 0.3, 17);

      // Drying fish on a pole
      post(U + 1.3, V + 1.05, 11); post(U + 1.85, V + 1.05, 11);

    // Shipyard: workshop, slipway with a hull under construction, a crane and timber
    function drawShipyard(U, V, rnd) {
      ground(U, V, 3, 3, '#a89870', rnd, '#8a7a5a');
      const u0 = U + 0.12, u1 = U + 1.05, v0 = V + 0.12, v1 = V + 0.95;
      ao(u0, v0, u1, v1);
      const w = walls(u0, v0, u1, v1, 0, 15, '#8a6038');
      boards(w.L, 0.08); boards(w.R, 0.08);
      door(w.L, 0.45, 0.18, 11);
      win(w.R, 0.4, 6, 0.14, 6, { shutter: '#4a3018' });
      roofU(u0, v0, u1, v1, 15, 14, '#5e4e46', '#8a6038', { style: 'shingle', boards: true });
      logPile(U + 1.3, V + 0.15, U + 2.85, V + 0.75, 3);

      // Slipway ramp
      const ramp = uvRect(U + 0.35, V + 1.3, U + 2.9, V + 2.4);
      poly('#8a6a44', ramp, 'rgba(50,30,10,0.5)');
      for (let i = 1; i < 12; i++) {
        const u = U + 0.35 + i * 2.55 / 12;
        line(P(u, V + 1.3), P(u, V + 2.4), 'rgba(50,30,10,0.35)', 0.7);
      }
      // Hull skeleton: keel plus U-shaped ribs, lower planks already fitted
      const kv = V + 1.85, ka = U + 0.75, kb = U + 2.55;
      line(P(ka, kv, 3), P(kb, kv, 3), '#5a3a1e', 2.2);
      for (let i = 0; i <= 9; i++) {
        const t = i / 9, u = ka + (kb - ka) * t, half = 0.08 + 0.3 * Math.sin(Math.PI * (0.1 + 0.8 * t));
        const pts = [];
        for (let k = 0; k <= 8; k++) {
          const a = Math.PI * k / 8;
          pts.push(P(u, kv - Math.cos(a) * half, 3 + (1 - Math.sin(a)) * 16));
        }
        ctx.strokeStyle = '#6a4422';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        pts.forEach((p, k) => k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
      }
      for (const z of [5, 8]) line(P(ka + 0.1, kv + 0.25, z), P(kb - 0.1, kv + 0.25, z), '#8a5a2e', 1.8);

      // Crane with a hanging beam
      post(U + 2.7, V + 1.15, 36);
      const top = P(U + 2.7, V + 1.15, 36), tip = P(U + 1.9, V + 1.55, 34);
      line(top, tip, '#5a3a1e', 1.8);
      line(tip, P(U + 1.9, V + 1.55, 18), 'rgba(40,30,20,0.8)', 0.8);
      logBand(U + 1.7, U + 2.1, V + 1.55, 16, 2);
      plankStack(U + 0.2, V + 2.55, U + 0.9, V + 2.85, 3);
    }

    function sheep(u, v, face = 1) {
      const p = P(u, v, 0);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 5.5, 2, 0, 0, Math.PI * 2); ctx.fill();
      line({ x: p.x - 2.5, y: p.y }, { x: p.x - 2.5, y: p.y - 3 }, '#3a3230', 1.1);
      line({ x: p.x + 2.5, y: p.y }, { x: p.x + 2.5, y: p.y - 3 }, '#3a3230', 1.1);
      // Fluffy fleece from overlapping puffs
      for (const [dx, dy, r] of [[-2.5, -5, 3], [1, -6, 3.2], [3, -4.5, 2.6], [-0.5, -4, 3]]) dot({ x: p.x + dx, y: p.y + dy }, r, '#f2eee4');
      dot({ x: p.x + face * 5, y: p.y - 5.5 }, 1.9, '#3a3230');
    }

    function drawMerchantHouse(U, V, rnd, vr) {
      ground(U, V, 2, 2, '#9a9282', rnd, '#7a7266');
      const roof = ['#4a5a6e', '#5a4a6a', '#3e5a5a'][vr % 3];

      barnDoor(wallL(u0, u1, v1, 0, 16), 0.72, 0.26, 8);
      for (const s of [0.3, 1.15]) win(g.L, s, 5, 0.14, 7, { shutter });
      for (const s of [0.3, 0.9]) win(g.R, s, 5, 0.14, 7, { shutter });
      const f1 = walls(u0, v0, u1 + 0.04, v1 + 0.04, 16, 29, '#efe4ca');
      timber(f1.L, '#5a3020', 0.24); timber(f1.R, '#5a3020', 0.24);
      for (const s of [0.28, 0.72, 1.16]) win(f1.L, s, 4, 0.13, 7, { shutter, flowers: true });
      for (const s of [0.3, 0.9]) win(f1.R, s, 4, 0.13, 7, { shutter });
      const f2 = walls(u0, v0, u1 + 0.08, v1 + 0.08, 29, 41, '#efe4ca');
      timber(f2.L, '#5a3020', 0.24); timber(f2.R, '#5a3020', 0.24);
      for (const s of [0.28, 0.72, 1.16]) win(f2.L, s, 3, 0.13, 7, { shutter });
      for (const s of [0.3, 0.9]) win(f2.R, s, 3, 0.13, 7, { shutter });
      const surf = roofU(u0, v0, u1 + 0.08, v1 + 0.08, 41, 28, roof, '#efe4ca', { style: 'tile', timber: '#5a3020', vent: 0.14 });
      const vm = (v0 + v1 + 0.08) / 2;
      chimney(u0 + 0.3, vm + 0.25, surf(vm + 0.31) - 2, surf(vm + 0.25) + 14, vr * 0.1);
      chimney(u1 - 0.25, vm + 0.25, surf(vm + 0.31) - 2, surf(vm + 0.25) + 14, vr * 0.1 + 0.5);
      // Gilded weathervane on the ridge
      const ridge = P((u0 + u1) / 2, vm, 41 + 28);
      line(ridge, { x: ridge.x, y: ridge.y - 10 }, '#8a6a2a', 1.2);
      poly('#e8c040', [{ x: ridge.x, y: ridge.y - 10 }, { x: ridge.x + 6, y: ridge.y - 8 }, { x: ridge.x, y: ridge.y - 6 }]);
      bush(U + 1.82, V + 0.45, 0.3);
      bush(U + 1.8, V + 1.2, 0.26, '#4a8a36');
      barrel(u0 + 0.45, v1 + 0.2);
    }

    // Hop farm: rows of tall hop poles with climbing bines and a round oast house with a white cowl
    function drawHopFarm(U, V, rnd) {

      win(w.L, 0.18, 9, 0.12, 7, { lit: true });
      for (const s of [0.3, 0.7]) win(w.R, s, 9, 0.13, 7, { lit: true });
      const surf = roofU(u0, v0, u1, v1, 20, 16, '#8a3a2a', '#b8ac94', { style: 'tile', vent: 0.12 });
      const vm = (v0 + v1) / 2;
      chimney(u0 + 0.25, vm + 0.2, surf(vm + 0.26) - 2, surf(vm + 0.2) + 24, 0.3);
      // Sign on a bracket
      const sp = P(u1 + 0.02, v1 - 0.1, 17);
      line(sp, { x: sp.x + 8, y: sp.y - 4 }, '#3a2616', 1.2);
      poly('#e8c050', [{ x: sp.x + 4, y: sp.y - 2 }, { x: sp.x + 11, y: sp.y - 5.5 }, { x: sp.x + 11, y: sp.y + 1.5 }, { x: sp.x + 4, y: sp.y + 5 }]);
      for (const [u, v, z] of [[U + 1.45, V + 0.4, 0], [U + 1.62, V + 0.55, 0], [U + 1.45, V + 0.7, 0], [U + 1.53, V + 0.55, 11]]) barrel(u, v, z);
      barrel(U + 0.5, V + 1.35);
      crate(U + 1.5, V + 1.35, 0.1);
    }

    // Forester: small log lodge with a green roof, a tree nursery and a watering can
    function drawForester(U, V, rnd) {
      ground(U, V, 2, 2, '#7a8a4a', rnd, '#5a6a36');
      poly('#6a5232', uvRect(U + 1.05, V + 0.12, U + 1.9, V + 1.9), 'rgba(40,30,15,0.4)');
      const u0 = U + 0.14, u1 = U + 0.92, v0 = V + 0.14, v1 = V + 0.9, wh = 12;
      ao(u0, v0, u1, v1);
      const w = walls(u0, v0, u1, v1, 0, wh, '#8a5a30');
      logCourses(w.L, 4); logCourses(w.R, 4);
      door(w.L, 0.45, 0.15, 9, '#4a2a12');
      win(w.R, 0.38, 4, 0.13, 5, { shutter: '#3a6a3a' });
      roofV(u0, v0, u1, v1, wh, 13, '#4a7a3a', '#8a5a30', { style: 'shingle', boards: true });
      // Rows of saplings in the nursery
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const tr = { u: 0, v: 0, s: 0.32 + ((r + c) % 3) * 0.08, conifer: (r + c) % 2 === 0, key: (r + c) % 2 ? 'd1' : 'c1',
                       dark: '#2e6624', mid: '#4a9232', light: '#7abe50' };
          drawTreeAt(U + 1.25 + c * 0.28, V + 0.35 + r * 0.55, tr);
        }
      }
      const wc = P(U + 0.55, V + 1.35, 0);
      poly('#8a9aa8', [{ x: wc.x - 3, y: wc.y }, { x: wc.x + 3, y: wc.y }, { x: wc.x + 3, y: wc.y - 5 }, { x: wc.x - 3, y: wc.y - 5 }]);
      line({ x: wc.x + 3, y: wc.y - 4 }, { x: wc.x + 7, y: wc.y - 7 }, '#8a9aa8', 1.4);
      fence(U + 1.02, V + 1.94, U + 1.94, V + 1.94);
      fence(U + 1.94, V + 0.1, U + 1.94, V + 1.94);
    }

    const BUILDING_RENDERERS = {
      forester: drawForester,
      house: drawHouse,
      sheepfarm: drawSheepFarm,
      weaver: drawWeaver,
      hopfarm: drawHopFarm,
      brewery: drawBrewery,
      fisher: drawFisher,
      grainfarm: drawGrainFarm,
      pigfarm: drawPigFarm,
      cattlefarm: drawCattleFarm,
      shipyard: drawShipyard,
      stonecutter: drawStonecutter,
      woodcutter: drawWoodcutter,
      sawmill: drawSawmill,
      warehouse: drawWarehouse
    };

    function drawBuilding(b) {
      const vr = Math.abs(b.x * 31 + b.y * 17);
      const rnd = seeded(b.x * 73856093 ^ b.y * 19349663);
      // Footprint origin corner (tile centres are at integer coords); the building is passed for state like house level
      BUILDING_RENDERERS[b.type](b.x - 0.5, b.y - 0.5, rnd, vr, b);
    }

    // ===== ROADS =====
    const isRoad = (x, y) => GAME.roads.has(`${x},${y}`);
    const isBuildingTile = (x, y) => {
      const occ = GAME.occupancy.get(`${x},${y}`);
      return !!occ && occ !== 'road';
    };
    const uvRect = (u0, v0, u1, v1) => [P(u0, v0), P(u1, v0), P(u1, v1), P(u0, v1)];

    // A dirt path that joins up with neighbouring roads and runs into buildings it touches
    // Wooden bridge deck over a canal, oriented along the road
    function drawBridge(x, y) {
      const alongU = isRoad(x - 1, y) || isRoad(x + 1, y) || !(isRoad(x, y - 1) || isRoad(x, y + 1));
      const z = 4, hw = 0.32;
      const [u0, v0, u1, v1] = alongU ? [x - 0.5, y - hw, x + 0.5, y + hw] : [x - hw, y - 0.5, x + hw, y + 0.5];
      // Supports down into the water
      for (const [pu, pv] of alongU ? [[x, v0], [x, v1]] : [[u0, y], [u1, y]]) line(P(pu, pv, 0), P(pu, pv, z), '#4a3018', 2);
