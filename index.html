<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anno Online Klon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; }

    /* ----- Top status bar ----- */
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      background: linear-gradient(#4a3420, #2e2014);
      border-bottom: 2px solid #c9a24e;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      color: #f0e2c0;
      font-size: 13px;
      z-index: 12;
      white-space: nowrap;
    }
    #hud .logo { font-family: Georgia, serif; font-size: 18px; font-weight: bold; color: #e8c060; letter-spacing: 1px; margin-right: 6px; }
    #hud .stat {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 10px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(201,162,78,0.35);
      border-radius: 4px;
    }
    #hud .stat small { font-size: 11px; }
    #hud .pos { color: #9ad06a; }
    #hud .neg { color: #f07a5a; }
    #hud .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #hud .sep { width: 1px; align-self: stretch; margin: 8px 2px; background: rgba(201,162,78,0.35); }
    #hud button {
      padding: 4px 9px;
      background: linear-gradient(#6a4c30, #4a3420);
      border: 1px solid #8a6a3a;
      border-radius: 4px;
      color: #f0e2c0;
      font-size: 12px;
      cursor: pointer;
    }
    #hud button:hover { background: linear-gradient(#7a5a38, #5a4028); }
    #hud button.active { border-color: #ffd700; background: linear-gradient(#8a6a34, #6a4c22); color: #fff; }
    #speed { display: flex; gap: 2px; }
    #speed button { padding: 4px 7px; }
    #hud #tick { color: #b8a680; font-size: 10px; }
    #btn-menu { font-size: 16px !important; padding: 2px 10px !important; }

    /* Pop-out game menu under the ☰ button */
    #game-menu {
      position: absolute;
      top: 44px; right: 8px;
      min-width: 180px;
      display: flex; flex-direction: column; gap: 4px;
      padding: 8px;
      background: linear-gradient(#4a3420, #2e2014);
      border: 2px solid #c9a24e;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }
    #game-menu[hidden] { display: none; }
    #game-menu button { text-align: left; display: flex; justify-content: space-between; gap: 10px; }
    #game-menu small { color: #b8a680; }
    #game-menu #saved-at { color: #b8a680; font-size: 10px; padding: 2px 4px 0; }

    /* Current quest, just under the bar on the left */
    #quest {
      position: absolute;
      top: 52px; left: 10px;
      max-width: 300px;
      padding: 8px 12px;
      background: linear-gradient(#f2e7cb, #e0cfa6);
      border: 2px solid #8a6a3a;
      border-radius: 6px;
      color: #3a2616;
      font-size: 12px;
      line-height: 1.4;
      z-index: 10;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    }
    #quest[hidden] { display: none; }
    #quest .muted, #quest small { color: #7a6448; }

    /* Recent messages, bottom left */
    #messages {
      position: absolute;
      bottom: 12px; left: 10px;
      max-width: 340px;
      display: flex; flex-direction: column-reverse; gap: 3px;
      z-index: 9;
      pointer-events: none;
    }
    #messages div {
      background: rgba(30,22,14,0.85);
      border-left: 3px solid #c9a24e;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 11px;
      color: #f0e2c0;
    }

    /* ----- Build menu: category tabs with a card panel above ----- */
    /* Spans the full width (so the card panel can use it) but only its children catch clicks */
    #build-menu {
      position: absolute;
      bottom: 10px; left: 10px; right: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    #build-menu > * { pointer-events: auto; max-width: 100%; }

    #build-tabs {
      display: flex;
      gap: 4px;
      background: rgba(34,24,14,0.94);
      border: 2px solid #c9a24e;
      border-radius: 8px;
      padding: 5px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }

    .build-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: linear-gradient(#5a4028, #3e2c1a);
      border: 1px solid #7a5a32;
      border-radius: 5px;
      color: #f0e2c0;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .build-tab .tab-icon { font-size: 17px; }
    .build-tab .tab-key { font-size: 10px; color: #b09a6a; }
    .build-tab:hover { background: linear-gradient(#6a4c30, #4a3420); }
    .build-tab.active { background: linear-gradient(#8a6a34, #6a4c22); border-color: #ffd700; color: #fff; }
    .build-tab:disabled { opacity: 0.35; cursor: not-allowed; }

    #build-panel {
      background: rgba(34,24,14,0.94);
      border: 2px solid #c9a24e;
      border-radius: 8px;
      padding: 8px 10px 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      color: #f0e2c0;
    }
    #build-panel[hidden] { display: none; }
    .panel-title { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #c9a24e; margin-bottom: 6px; }
    .cards { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .panel-desc { margin-top: 6px; font-size: 11px; color: #d8c8a0; min-height: 14px; text-align: center; }

    .build-card {
      width: 110px;
      padding: 5px 5px 6px;
      background: linear-gradient(#efe3c4, #d8c69c);
      border: 2px solid #8a6a3a;
      border-radius: 6px;
      color: #3a2616;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
    }
    .build-card canvas {
      display: block;
      margin: 0 auto 3px;
      background: radial-gradient(ellipse at 50% 80%, #7aa84e 0%, #5a8a3a 60%, #4a7a2e 100%);
      border-radius: 4px;
    }
    .build-card .card-name { font-size: 12px; font-weight: bold; }
    .build-card .card-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; font-size: 10px; margin-top: 2px; padding: 0 2px; line-height: 1.3; text-align: left; }
    .build-card .card-size { color: #7a6040; flex-shrink: 0; }
    .build-card:hover { border-color: #c9a24e; filter: brightness(1.05); }
    .build-card.active { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.8); }
    .build-card.unaffordable .card-cost { color: #b02a2a; font-weight: bold; }
    .build-card.unaffordable canvas { filter: grayscale(0.7); }
    .build-card:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.8); }

    #banner {
      position: absolute;
      top: 56px; left: 50%;
      transform: translateX(-50%);
      background: rgba(20,30,50,0.92);
      border: 1px solid #ffd700;
      border-radius: 5px;
      padding: 10px 18px;
      font-size: 14px;
      z-index: 10;
      text-align: center;
    }
    #banner small { display: block; color: #aab; margin-top: 3px; font-size: 11px; }
    #banner[hidden] { display: none; }

    #status { color: #f0b050; font-size: 12px; }
    #food-status { color: #f07a5a; font-size: 12px; }

    /* ----- Info panel (warehouse / shipyard / ship / building) ----- */
    #info {
      position: absolute;
      top: 52px; right: 10px;
      width: 300px;
      max-height: calc(100vh - 170px); /* below the status bar, clear of the zoom controls */
      overflow-y: auto;
      background: linear-gradient(#f2e7cb, #e0cfa6);
      border: 2px solid #8a6a3a;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      color: #3a2616;
      z-index: 15;
      font-size: 12px;
    }
    #info[hidden] { display: none; }
    .info-head {
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(#5a4028, #3e2c1a);
      color: #f0e2c0;
      padding: 7px 10px;
      font-weight: bold;
      font-size: 13px;
      position: sticky; top: 0;
    }
    .info-head button { background: none; border: none; color: #f0e2c0; font-size: 18px; cursor: pointer; line-height: 1; }
    #info-body { padding: 8px 10px 10px; }
    #info-body h4 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #7a5a2a; }
    #info-body p { margin: 4px 0; line-height: 1.4; }
    #info-body .muted { color: #7a6448; font-size: 11px; }
    #info-body .err { color: #b02a2a; font-weight: bold; }
    #info-body .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid rgba(90,64,40,0.15); }
    #info-body .row b { text-align: right; }
    #info-body .res { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; margin: 4px 0; }
    #info-body .res .bar { grid-column: 1 / -1; }
    #info-body .bar { height: 5px; background: rgba(90,64,40,0.2); border-radius: 3px; overflow: hidden; margin: 2px 0 4px; }
    #info-body .bar div { height: 100%; background: linear-gradient(90deg, #6a9a3a, #c9a24e); }
    #info-body label { display: block; margin: 5px 0; }
    #info-body select { width: 100%; margin-top: 2px; padding: 3px; font-size: 12px; }
    #info-body .goods { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; margin: 6px 0; }
    #info-body .chk { margin: 0; font-size: 11px; cursor: pointer; }
    #info-body .btns { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 6px; }
    #info-body button:not(.link) {
      padding: 5px 12px; background: #4a6fa5; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 12px;
    }
    #info-body button.alt { background: #8a4a3a; }
    #info-body button:disabled { opacity: 0.4; cursor: not-allowed; }
    #info-body button.link { background: none; border: none; color: #2a5aa8; cursor: pointer; font-size: 12px; padding: 0; }
    #info-body .ship-card { border: 1px solid rgba(90,64,40,0.3); border-radius: 5px; padding: 6px; margin: 5px 0; background: rgba(255,255,255,0.3); }
    #info-body .ship-card.locked { opacity: 0.6; }

    #toast {
      position: absolute;
      top: 60px; left: 50%;
      transform: translateX(-50%);
      background: rgba(20,30,50,0.94);
      border: 1px solid #ffd700;
      border-radius: 5px;
      padding: 8px 16px;
      font-size: 13px;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #toast.show { opacity: 1; }

    #view-controls {
      position: absolute;
      bottom: 10px; right: 10px;
      background: rgba(0,0,0,0.85);
      border: 1px solid #4a6fa5;
      border-radius: 5px;
      padding: 8px;
      z-index: 10;
      text-align: right;
    }
    #view-controls button {
      width: 34px; height: 34px;
      margin-left: 4px;
      background: #4a6fa5;
      border: none;
      border-radius: 3px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    #view-controls button:hover { background: #5a7fb5; }
    #view-controls .hint { margin-top: 6px; font-size: 10px; color: #99a; line-height: 1.5; }

    #debug {
      position: absolute;
      top: 52px; left: 320px;
      background: rgba(0,0,0,0.9);
      padding: 10px;
      border-radius: 5px;
      font-size: 11px;
      z-index: 10;
      border: 1px solid #4a4a4a;
      max-width: 300px;
      max-height: 250px;
      overflow-y: auto;
      font-family: monospace;
    }

    #debug[hidden] { display: none; }
    .log { margin: 2px 0; padding: 1px 4px; }
    .log-ok { color: #4a4; }
    .log-err { color: #a44; }
    .log-info { color: #4aa; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <span class="logo">Anno</span>
    <span class="stat" id="coins" title="Mønter og balance (skat minus drift)">🪙 0</span>
    <span class="stat" id="pop" title="Beboere i alt / pladser · højeste niveau">👥 0/0</span>
    <span class="stat" id="island-name" title="Øen du kigger på · frugtbarhed. Klik på et lager for at se øens varer.">📍 —</span>
    <span class="grow"><span id="status"></span> <span id="food-status"></span></span>
    <span id="speed" title="Spilhastighed (mellemrum = pause)">
      <button data-speed="0">⏸</button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="3">3×</button>
    </span>
    <span class="sep"></span>
    <button id="btn-routes" title="Handelsruter – tegn ruter og sæt skibe på">🗺️ Ruter</button>
    <button id="btn-economy" title="Økonomioverblik">📊 Økonomi</button>
    <span id="tick">Tick: 0</span>
    <button id="btn-menu" title="Menu">☰</button>
    <div id="game-menu" hidden>
      <button id="btn-save">💾 Gem spil <small>Ctrl+S</small></button>
      <button id="btn-new">🆕 Nyt spil</button>
      <div id="saved-at"></div>
    </div>
  </div>

  <div id="quest" hidden></div>
  <div id="messages"></div>

  <div id="toast"></div>

  <div id="info" hidden>
    <div class="info-head"><span id="info-title"></span><button id="info-close" title="Luk (Esc)">×</button></div>
    <div id="info-body"></div>
  </div>

  <div id="banner">
    🏚️ Vælg hvor dit første lager skal stå
    <small>Det første lager er gratis og skal ligge ved kysten. Produktionsbygninger skal forbindes til lageret med vej.</small>
  </div>

  <div id="build-menu">
    <div id="build-panel" hidden></div>
    <div id="build-tabs"></div>
  </div>

  <div id="view-controls">
    <button data-view="out" title="Zoom ud (-)">−</button>
    <button data-view="in" title="Zoom ind (+)">+</button>
    <button data-view="home" title="Centrér på lager (H)">⌂</button>
    <div class="hint">Træk: flyt kort · Scroll: zoom<br>WASD / piletaster: flyt · H: hjem</div>
  </div>

  <div id="debug" hidden>DEBUG</div>

  <script>
    'use strict';

    // Simple debug logger
    const LOG = [];
    function log(msg, type = 'info') {
      const prefix = type === 'ok' ? '✓' : type === 'err' ? '✗' : 'i';
      const entry = `[${prefix}] ${msg}`;
      LOG.unshift(entry);
      if (LOG.length > 20) LOG.pop();
      console.log(entry);
      updateDebug();
    }

    function updateDebug() {
      const el = document.getElementById('debug');
      if (el) {
        el.innerHTML = LOG.map(l => {
          let cls = 'log-info';
          if (l.includes('✓')) cls = 'log-ok';
          if (l.includes('✗')) cls = 'log-err';
          return `<div class="log ${cls}">${l}</div>`;
        }).join('');
      }
    }

    // ===== GAME STATE =====
    const MAP_SIZE = 96;

    const GAME = {
      grid: [],
      buildings: [],
      occupancy: new Map(),
      islands: new Map(),      // island id -> { name, resources, cap, pop, popCap, fertility, ... } (one storage per landmass)
      ships: [],
      roads: new Set(),        // "x,y" keys of road tiles (a road on a canal tile is a bridge)
      connected: new Set(),    // ids of buildings linked to a warehouse by road
      phase: 'setup',          // 'setup' until the first warehouse is placed, then 'play'
      roadDrag: null,          // start tile while dragging out a road or canal
      shipCounter: 0,
      routes: [],              // player-drawn trade routes (several ships can sail one route)
      routeCounter: 0,
      routeDraw: null,         // state while the player is drawing a route on the map
      coins: 0,
      tierReached: 1,          // highest house level reached so far (unlocks buildings and ships)
      questIndex: 0,
      speed: 1,                // 0 = paused, 1-3 = game speed
      tick: 0,
      selectedBuilding: null,
      hoveredTile: null,
      camera: { x: 0, y: 0, zoom: 1 }
    };

    const RESOURCES = {
      wood:   { name: 'Træstammer', icon: '🌲' },
      planks: { name: 'Planker',    icon: '📦' },
      stone:  { name: 'Sten',       icon: '🪨' },
      fish:   { name: 'Fisk',       icon: '🐟', food: true },
      grain:  { name: 'Korn',       icon: '🌾' },
      pork:   { name: 'Svinekød',   icon: '🥓', food: true, meat: true },
      beef:   { name: 'Oksekød',    icon: '🥩', food: true, meat: true },
      wool:   { name: 'Uld',        icon: '🐑' },
      cloth:  { name: 'Tøj',        icon: '👕' },
      hops:   { name: 'Humle',      icon: '🌿' },
      beer:   { name: 'Øl',         icon: '🍺' }
    };
    const RES_KEYS = Object.keys(RESOURCES);
    const FOOD_KEYS = RES_KEYS.filter(k => RESOURCES[k].food);
    const MEAT_KEYS = RES_KEYS.filter(k => RESOURCES[k].meat);
    // Coins are global (not stored per island) but appear in costs like any other good
    const RES_ICONS = { ...Object.fromEntries(RES_KEYS.map(k => [k, RESOURCES[k].icon])), coins: '🪙' };
    const emptyStock = () => Object.fromEntries(RES_KEYS.map(k => [k, 0]));

    // Island fertility decides which farms can be built there
    const FERTILITY = {
      grain: { name: 'Korn',  icon: '🌾' },
      sheep: { name: 'Får',   icon: '🐑' },
      hops:  { name: 'Humle', icon: '🌿' }
    };

    // ----- Balance -----
    const WAREHOUSE_CAP = 150;                                    // storage per resource per warehouse
    // Delivered with the very first warehouse. 80 planks covers fisher + 3 houses + woodcutter + sawmill (64)
    // with some slack, so the plank chain can always be started.
    const START_STOCK = { planks: 80, fish: 25 };
    const START_COINS = 1000;
    const FOUNDING_COST = { coins: 150, planks: 30, stone: 10 };  // first warehouse on another island (needs a ship)
    const EXTRA_WAREHOUSE_POP = 20;                               // island residents needed per existing warehouse
    const extraWarehouseCost = (count) => ({ coins: 100 + 50 * count, planks: 30 + 15 * count, stone: 25 + 15 * count });
    const STARVE_TICKS = 5;                                       // without food, one resident leaves every N ticks
    // Getting a new island going: the founding ship brings supplies, and an island's first few settlers
    // bring their own provisions (no food needed), so they can staff the first fisher.
    const FOUNDING_SUPPLIES = { planks: 30, fish: 20 };
    const FREE_SETTLERS = 4;
    const UPGRADE_EVERY = 3;                                      // at most one house upgrade per island every N ticks

    // Natural resources on the map run out. Wood grows back (slowly, faster with a forester); stone does not.
    const WOOD_PER_TREE = 10;       // wood units per tree (forest tiles hold 2-3 trees)
    const ROCK_STONE = 80;          // stone units per rock tile, never replenished
    const REGROW_SAMPLES = 60;      // tiles checked per tick for natural regrowth
    const REGROW_CHANCE = 0.25;     // chance a sampled forest tile grows one wood unit (~1 tree per hour or so)
    const STUMP_SPROUT_CHANCE = 0.1;// chance a sampled clearing with stumps sprouts a sapling
    const FORESTER_RADIUS = 5;

    // What each resident consumes per second, by need
    const NEED_RATES = { food: 0.02, meat: 0.008, cloth: 0.006, beer: 0.008 };
    const NEED_INFO = {
      food:  { name: 'Mad',  icon: '🍽️', keys: FOOD_KEYS },
      meat:  { name: 'Kød',  icon: '🥩', keys: MEAT_KEYS },
      cloth: { name: 'Tøj',  icon: '👕', keys: ['cloth'] },
      beer:  { name: 'Øl',   icon: '🍺', keys: ['beer'] }
    };

    // House levels. A house upgrades when its needs are met, the next level's goods are in stock
    // and the island can pay the upgrade materials. Unmet needs drop capacity to the level below.
    const HOUSE_LEVELS = [
      null,
      { name: 'Pionerer', cap: 6,  tax: 0.02, needs: ['food'],                          upgrade: { coins: 30, planks: 10, stone: 4 } },
      { name: 'Borgere',  cap: 12, tax: 0.05, needs: ['food', 'meat', 'cloth'],         upgrade: { coins: 80, planks: 15, stone: 12 } },
      { name: 'Købmænd',  cap: 20, tax: 0.10, needs: ['food', 'meat', 'cloth', 'beer'] }
    ];

    // workers: residents needed to run it · upkeep: coins/s · tier: house level needed to unlock
    const DEFS = {
      house: { id: 'house', name: 'Bolig', w: 2, h: 2, cost: { coins: 20, planks: 8 }, house: true,
        desc: 'Bolig for 6 pionerer. De første 4 beboere på en ø klarer sig uden mad; resten skal have fisk eller kød. Opgraderes til Borgere (12) og Købmænd (20).' },
      woodcutter: { id: 'woodcutter', name: 'Skovhugger', w: 2, h: 2, cost: { coins: 30, planks: 10 }, workers: 2, upkeep: 0.04,
        produces: 'wood', rate: 0.8, near: { terrain: 'forest', label: 'skov' },
        harvest: { terrain: 'forest', key: 'wood', radius: 4, label: 'træer' },
        desc: 'Fælder træerne omkring sig – skoven forsvinder efterhånden. Byg en skovfoged for at plante nye.' },
      forester: { id: 'forester', name: 'Skovfoged', w: 2, h: 2, cost: { coins: 40, planks: 10 }, workers: 1, upkeep: 0.03,
        desc: 'Planter og plejer træer inden for 5 felter – også på fri græsjord. Én skovfoged holder cirka én skovhugger i gang.' },
      sawmill: { id: 'sawmill', name: 'Savværk', w: 3, h: 2, cost: { coins: 50, planks: 20 }, workers: 3, upkeep: 0.06,
        consumes: { wood: 0.8 }, produces: 'planks', rate: 0.8,
        desc: 'Saver træ til planker. Kræver vej til et lager.' },

        desc: 'Brygger øl af korn og humle. Købmænd skal have øl.' },
      shipyard: { id: 'shipyard', name: 'Skibsbygger', w: 3, h: 3, cost: { coins: 150, planks: 40, stone: 20 }, workers: 5, upkeep: 0.1,
        coastal: true, needsRoad: true,
        desc: 'Bygger skibe. Skal ligge ved havet og have vej til et lager. Klik på den for at bygge skibe.' },

      road: { id: 'road', name: 'Vej', w: 1, h: 1, cost: {},
        desc: 'Forbinder bygninger med lageret. Træk for at bygge. Gennem skov fældes træerne; over en kanal bliver det en bro.' },

        desc: 'Graver en vandvej for skibe. Skal starte ved vand. Kan dele en ø i to – byg en bro med vej-værktøjet.' }
    };

    // Ship types: bigger ships are unlocked by house level and sail further with more cargo
    const SHIP_TYPES = {
      jolle:   { id: 'jolle',   name: 'Jolle',   cost: { coins: 60, planks: 15 },              cargo: 20,  range: 35,  speed: 2.2, buildTime: 15, tier: 1, upkeep: 0.05, size: 0.8 },
      kogge:   { id: 'kogge',   name: 'Kogge',   cost: { coins: 200, planks: 50, stone: 15 },  cargo: 60,  range: 80,  speed: 2.0, buildTime: 30, tier: 2, upkeep: 0.15, size: 1.1 },
