        <div class="btns"><button class="link" data-act="all">‹ Alle ruter</button></div>
        ${sel.error ? `<p class="err">${esc(sel.error)}</p>` : ''}`;
      // Goods changes apply right away, also to ships already sailing the route
      body.querySelectorAll('input[data-res]').forEach(el => el.addEventListener('change', () => {
        const f = el.dataset.list, k = el.dataset.res;
        r[f] = el.checked ? [...new Set([...r[f], k])] : r[f].filter(x => x !== k);
        saveGame();
      }));
      body.querySelector('[data-f="ship"]')?.addEventListener('change', (e) => { sel.pickShip = e.target.value; e.target.blur(); });
      body.querySelector('[data-act="assign"]')?.addEventListener('click', () => {
        const s = GAME.ships.find(x => x.id === (sel.pickShip ?? pick));
        sel.error = s ? assignShip(s, r.id) || '' : 'Vælg et skib';
        if (!sel.error) { sel.pickShip = null; notify(`⛵ ${s.name} sejler nu ${routeName(r)}`); saveGame(); }
        renderInfo();
      });
      body.querySelectorAll('[data-unassign]').forEach(el => el.addEventListener('click', () => {
        stopRoute(GAME.ships.find(x => x.id === el.dataset.unassign));
        saveGame();
        renderInfo();
      }));
      body.querySelector('[data-act="redraw"]').addEventListener('click', () => startRouteDraw({ editId: r.id }));
      body.querySelector('[data-act="delete"]').addEventListener('click', () => {
        if (!confirm(`Slette ruten ${routeName(r)}?`)) return;
        deleteRoute(r);
        saveGame();
        openInfo('routes');
      });
      body.querySelector('[data-act="all"]').addEventListener('click', () => openInfo('routes'));
    }

    function renderEconomy(title, body) {
      title.textContent = '📊 Økonomi';
      const net = (GAME.lastTax || 0) - (GAME.lastUpkeep || 0);
      const islands = [...GAME.islands.values()].filter(i => i.warehouses);
      body.innerHTML = `
        <div class="row"><span>🪙 Mønter</span><b>${Math.floor(GAME.coins)}</b></div>
        <div class="row"><span>Skat</span><b>+${rate(GAME.lastTax || 0)}/s</b></div>
        <div class="row"><span>Drift</span><b>−${rate(GAME.lastUpkeep || 0)}/s</b></div>
        <div class="row"><span>Balance</span><b class="${net < 0 ? 'err' : ''}">${net >= 0 ? '+' : ''}${rate(net)}/s</b></div>
        ${islands.map(isl => {
          const rows = RES_KEYS.filter(k => isl.resources[k] >= 1 || isl.flowIn?.[k] || isl.flowOut?.[k]).map(k => {
            const d = (isl.flowIn?.[k] || 0) - (isl.flowOut?.[k] || 0);
            return `<div class="row"><span>${RES_ICONS[k]} ${RESOURCES[k].name}</span><b>${Math.floor(isl.resources[k])} <small class="${d < 0 ? 'err' : ''}">(${d >= 0 ? '+' : ''}${rate(d)}/s)</small></b></div>`;
          }).join('');
          return `<h4>${esc(isl.name)} · 👥 ${isl.pop}/${isl.popCap}</h4>${rows || '<p class="muted">Ingen varer</p>'}`;
        }).join('')}
        <p class="muted">Tallene i parentes er produktion minus forbrug (uden skibe).</p>`;
    }

    document.getElementById('info-close').addEventListener('click', closeInfo);

    // ===== SAVE / LOAD =====
    // The game autosaves to localStorage after every action, every 10 s and when the page closes.
    // The map is stored as one character per tile; decoration is regenerated from NOISE_SEED.
    const SAVE_KEY = 'anno-online-save';
    const SAVE_VERSION = 3;
    const AUTOSAVE_TICKS = 10;
    const TYPE_CODES = { grass: 'g', forest: 'f', water: 'w', beach: 'b', rock: 'r' };
    const CODE_TYPES = Object.fromEntries(Object.entries(TYPE_CODES).map(([t, c]) => [c, t]));
    let lastSavedAt = null;
    let saveDisabled = false; // set when starting a new game, so the unload handler doesn't re-save
    let oldSaveIgnored = false;
    const pendingNotices = []; // messages from loading, shown once the UI is up
    let migratedFrom = null;

    function saveGame(manual = false) {
      if (saveDisabled) return false;
      const data = {
        v: SAVE_VERSION,
        mapSize: MAP_SIZE,
        noiseSeed: NOISE_SEED,
        // Extra codes: c = canal, s = clearing with stumps, q = worked-out quarry
        terrain: GAME.grid.map(t => t.canal ? 'c' : t.stumps ? 's' : t.quarried ? 'q' : TYPE_CODES[t.type]).join(''),
        // Only tiles that differ from "full" are stored: [tile index, amount]
        wood: GAME.grid.flatMap((t, i) => t.type === 'forest' && t.wood < t.woodMax ? [[i, t.wood]] : []),
        stone: GAME.grid.flatMap((t, i) => t.type === 'rock' && t.stone < ROCK_STONE ? [[i, t.stone]] : []),
        buildings: GAME.buildings.map(({ id, type, x, y, queue, level }) => ({ id, type, x, y, queue, level })),
        roads: [...GAME.roads],
        // Islands are matched on load by their anchor tile, since ids come from re-labelling the map
        islands: [...GAME.islands.values()].map(i => ({ anchor: i.anchor, name: i.name, home: i.home, start: i.start,
                                                         resources: i.resources, pop: i.pop, fertility: i.fertility, supplied: i.supplied })),
        ships: GAME.ships.map(({ id, type, name, x, y, dir, routeId, cargo, state, trips }) => ({ id, type, name, x, y, dir, routeId, cargo, state, trips })),
        shipCounter: GAME.shipCounter,
        routes: GAME.routes.map(({ id, from, to, waypoints, res, back }) => ({ id, from, to, waypoints, res, back })),
        routeCounter: GAME.routeCounter,
        coins: GAME.coins,
        tierReached: GAME.tierReached,
        questIndex: GAME.questIndex,
        tick: GAME.tick,
        phase: GAME.phase,
        camera: GAME.camera,
        savedAt: Date.now()
      };
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        lastSavedAt = new Date(data.savedAt);
        if (manual) showToast('💾 Spillet er gemt');
        return true;
      } catch (err) {
        if (manual) showToast('⚠ Kunne ikke gemme i denne browser');
        log(`Kunne ikke gemme: ${err.message}`, 'err');
        return false;
      }
    }

    function initIslands() {
      GAME.islands = new Map();
      for (const c of labelIslands()) GAME.islands.set(c.id, newIsland(c));
      // The biggest island is the start island; it gets grain only (see assignFertility)
      const start = [...GAME.islands.values()].sort((a, b) => b.size - a.size)[0];
      start.start = true;
      assignFertility(start.id);
      updateIslandStats();
    }

    // Version 2 saves (before house levels and coins): borgerhus -> level 2 house, pioneer huts are dropped
    function migrateV2(data) {
      data.buildings = data.buildings.flatMap(b => {
        if (b.type === 'house_medium') return [{ ...b, type: 'house', level: 2 }];
        if (b.type === 'house_small') return [];
        return [b];
      });
      data.coins = START_COINS;
      data.tierReached = data.buildings.some(b => b.level === 2) ? 2 : 1;
      data.questIndex = 0;
      data.needsFertility = true;
      return data;
    }

    // Restores GAME from localStorage. Returns false (and leaves GAME untouched) if there's no usable save.
    function loadGame() {
      let data;
      try {
        data = JSON.parse(localStorage.getItem(SAVE_KEY));
      } catch {
        return false;
      }
      if (data && data.v === 2) { data = migrateV2(data); migratedFrom = 2; }
      else if (data && data.v !== SAVE_VERSION) oldSaveIgnored = true;
      if (!data || (data.v !== SAVE_VERSION && migratedFrom !== 2) || data.mapSize !== MAP_SIZE ||
          typeof data.terrain !== 'string' || data.terrain.length !== MAP_SIZE * MAP_SIZE) {
        return false;
      }

      NOISE_SEED = data.noiseSeed;
      GAME.grid = [...data.terrain].map((c, i) => ({
        x: i % MAP_SIZE, y: Math.floor(i / MAP_SIZE),
        type: c === 'c' ? 'water' : (c === 's' || c === 'q') ? 'grass' : (CODE_TYPES[c] || 'grass'),
        canal: c === 'c', stumps: c === 's', quarried: c === 'q'
      }));
      // Depleted forests and quarries (older saves have none, so everything starts full)
      for (const [i, amt] of data.wood || []) GAME.grid[i].wood = amt;
      for (const [i, amt] of data.stone || []) GAME.grid[i].stone = amt;
      GAME.buildings = data.buildings.filter(b => DEFS[b.type]);
      GAME.roads = new Set(data.roads);
      GAME.occupancy.clear();
      for (const key of GAME.roads) GAME.occupancy.set(key, 'road');
      for (const b of GAME.buildings) {
        const def = DEFS[b.type];
        if (def.house) b.level = b.level || 1;
        for (let dy = 0; dy < def.h; dy++) {
          for (let dx = 0; dx < def.w; dx++) GAME.occupancy.set(`${b.x + dx},${b.y + dy}`, b.id);
        }
      }

      GAME.islands = new Map();
      for (const c of labelIslands()) {
        const saved = data.islands.find(i => tileAt(i.anchor[0], i.anchor[1])?.island === c.id);
        const isl = newIsland(c);
        if (saved) {
          Object.assign(isl, { name: saved.name, home: saved.home, start: saved.start, pop: saved.pop, fertility: saved.fertility || [], supplied: saved.supplied });
          Object.assign(isl.resources, saved.resources); // merge: resources added later keep 0
        }
        GAME.islands.set(c.id, isl);
      }
      if (data.needsFertility) {
        const home = homeIsland() || [...GAME.islands.values()].sort((a, b) => b.size - a.size)[0];
        home.start = true;
        assignFertility(home.id);
      }
      updateIslandStats();
      // Colonies founded before founding supplies existed get them delivered once
      for (const isl of GAME.islands.values()) {
        if (!isl.home && isl.warehouses && !isl.supplied) {
          const got = deliverSupplies(homeIsland(), isl);
          pendingNotices.push(`⚓ ${isl.name} har fået en startforsyning: ${fmtCost(got)}`);
        }
      }

      GAME.routes = (data.routes || []).map(r => ({ ...r, length: 0 }));
      GAME.routeCounter = data.routeCounter || GAME.routes.length;
      GAME.ships = (data.ships || []).filter(s => SHIP_TYPES[s.type]).map(s => {
        const ship = { ...s, cargo: { ...emptyStock(), ...s.cargo }, path: [], timer: 0, routeId: s.routeId || null };
        if (s.route) {
          GAME.routeCounter++;
          const r = { id: `r_${GAME.routeCounter}`, from: s.route.from, to: s.route.to, waypoints: [], res: s.route.res || [], back: s.route.back || [], length: 0 };
          GAME.routes.push(r);
          ship.routeId = r.id;
          delete ship.route;
        }
        return ship;
      });
      GAME.shipCounter = data.shipCounter || GAME.ships.length;
      GAME.coins = data.coins ?? START_COINS;
      GAME.tierReached = data.tierReached || 1;
      GAME.questIndex = data.questIndex || 0;
      Object.assign(GAME.camera, data.camera);
      GAME.tick = data.tick || 0;
      GAME.phase = data.phase === 'play' ? 'play' : 'setup';
      lastSavedAt = new Date(data.savedAt);
      return true;
    }

    // Ships resume their route after loading (paths aren't saved)
    function resumeShips() {
      for (const s of GAME.ships) {
        const r = shipRoute(s);
        const from = r && buildingById(r.from), to = r && buildingById(r.to);
        if (!from || !to) { stopRoute(s); continue; }
        if (s.state === 'loading' || s.state === 'unloading') s.timer = 1;
        else if (s.state === 'toTo') sailTo(s, to, 'toTo', r.waypoints);
        else sailTo(s, from, 'toFrom', [...r.waypoints].reverse());
      }
    }

    function newGame() {
      if (!confirm('Starte et nyt spil? Dit nuværende spil bliver slettet.')) return;
      saveDisabled = true;
      try { localStorage.removeItem(SAVE_KEY); } catch { /* storage unavailable: nothing to delete */ }
      location.reload();
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function setSpeed(s) {
      GAME.speed = s;
      document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('active', Number(b.dataset.speed) === s));
    }

    const gameMenu = document.getElementById('game-menu');
    document.getElementById('btn-menu').addEventListener('click', (e) => {
      e.stopPropagation();
      gameMenu.hidden = !gameMenu.hidden;
    });
    document.addEventListener('click', (e) => { if (!gameMenu.contains(e.target)) gameMenu.hidden = true; });
    document.getElementById('btn-save').addEventListener('click', () => { saveGame(true); gameMenu.hidden = true; });
    document.getElementById('btn-new').addEventListener('click', () => { gameMenu.hidden = true; newGame(); });
    document.getElementById('btn-routes').addEventListener('click', () => {
      if (GAME.selectedInfo?.kind === 'routes') closeInfo(); else openInfo('routes');
    });
    document.getElementById('btn-economy').addEventListener('click', () => {
      if (GAME.selectedInfo?.kind === 'economy') closeInfo(); else openInfo('economy');
    });
    document.querySelectorAll('#speed button').forEach(b => b.addEventListener('click', () => setSpeed(Number(b.dataset.speed))));
    let speedBeforePause = 1;
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveGame(true);
      }
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        if (GAME.speed) { speedBeforePause = GAME.speed; setSpeed(0); } else setSpeed(speedBeforePause);
      }
    });
    window.addEventListener('beforeunload', () => saveGame());

    // ===== SIMULATION =====
    // Takes up to `amount` from the given goods, spread over those in stock. Returns what was taken.
    function consume(isl, keys, amount) {
      let taken = 0;
      for (let pass = 0; pass < 2 && taken < amount - 1e-9; pass++) {
        const avail = keys.filter(k => isl.resources[k] > 0);
        if (!avail.length) break;
        const share = (amount - taken) / avail.length;
        for (const k of avail) {
          const t = Math.min(share, isl.resources[k]);
          isl.resources[k] -= t;
          isl.flowOut[k] += t;
          taken += t;
        }
      }
      return taken;
    }

    const inStock = (isl, need) => NEED_INFO[need].keys.some(k => isl.resources[k] >= 1);

    // ----- Natural resources -----
    let rocksDirty = false; // set when quarrying visibly changes a rock tile; mountains are rebuilt once per tick

    // Tiles within `r` of a building's footprint, nearest first
    function tilesAround(b, r) {
      const def = DEFS[b.type], cx = b.x + (def.w - 1) / 2, cy = b.y + (def.h - 1) / 2, out = [];
      for (let y = b.y - r; y < b.y + def.h + r; y++) {
        for (let x = b.x - r; x < b.x + def.w + r; x++) {
          const t = tileAt(x, y);
          if (t) out.push(t);
        }
      }
      return out.sort((a, c) => Math.hypot(a.x - cx, a.y - cy) - Math.hypot(c.x - cx, c.y - cy));
    }

    // The tile a harvester is working on: keeps chopping the same one until it's empty, then the nearest next
    function harvestTarget(b) {
      const { terrain, key, radius } = DEFS[b.type].harvest;
      const ok = (t) => t && t.type === terrain && t[key] > 0;
      let t = b.harvestAt && tileAt(b.harvestAt[0], b.harvestAt[1]);
      if (!ok(t)) {
        t = tilesAround(b, radius).find(ok) || null;
        b.harvestAt = t ? [t.x, t.y] : null;
      }
      return t;
    }

    // Remaining harvestable amount around a harvester (for the info panel)
    const harvestLeft = (b) => {
      const { terrain, key, radius } = DEFS[b.type].harvest;
      return Math.round(tilesAround(b, radius).reduce((s, t) => s + (t.type === terrain ? t[key] || 0 : 0), 0));
    };

    // Turns emptied tiles into clearings (forest) or gravel (rock), and flags visible rock changes
    function depleteTile(t) {
      if (t.type === 'forest' && t.wood <= 0) {
        t.type = 'grass';
        t.stumps = true;
        t.wood = 0;
        decorateTile(t);
      } else if (t.type === 'rock') {
        const stage = Math.ceil((t.stone / ROCK_STONE) * 4);
        if (t.stone <= 0) {
          t.type = 'grass';
          t.quarried = true;
          rocksDirty = true;
        } else if (stage !== t.stoneStage) {
          rocksDirty = true;
        }
        t.stoneStage = stage;
      }
    }

    // Grows a sapling on an empty clearing or grass tile
    function plantTree(t) {
      t.type = 'forest';
      t.stumps = false;
      t.wood = 1;
      decorateTile(t);
    }

    const canPlantOn = (t) => t.type === 'grass' && !t.quarried && !GAME.occupancy.has(`${t.x},${t.y}`);

    // One unit of growth per tick: first tend young or thinned trees, then plant on stumps, then on free grass
    function tendForest(b) {
      const around = tilesAround(b, FORESTER_RADIUS);
      const grow = around.find(t => t.type === 'forest' && t.wood < t.woodMax);
      if (grow) { grow.wood++; return true; }
      const spot = around.find(t => canPlantOn(t) && t.stumps) || around.find(canPlantOn);
      if (spot) { plantTree(spot); return true; }
      return false;
    }

    function naturalRegrowth() {
      for (let i = 0; i < REGROW_SAMPLES; i++) {
        const t = GAME.grid[Math.floor(Math.random() * GAME.grid.length)];
        if (t.type === 'forest' && t.wood < t.woodMax && Math.random() < REGROW_CHANCE) t.wood++;
        else if (t.stumps && canPlantOn(t) && Math.random() < STUMP_SPROUT_CHANCE) plantTree(t);
      }
    }

    function tick() {
      updateIslandStats();
      const islands = [...GAME.islands.values()];
      for (const isl of islands) {
        isl.flowIn = emptyStock();
        isl.flowOut = emptyStock();
        isl.workersFree = Math.floor(isl.pop);
      }

      // Staffing: food producers get workers first, then everything else in build order
      const staffed = GAME.buildings.filter(b => DEFS[b.type].workers)
        .sort((a, b) => (DEFS[b.type].food ? 1 : 0) - (DEFS[a.type].food ? 1 : 0));
      for (const b of staffed) {
        const isl = islandOfBuilding(b), need = DEFS[b.type].workers;
        b.staffed = isl.workersFree >= need;
        if (b.staffed) isl.workersFree -= need;
      }

      // Production. Raw producers first, then processors, so this tick's raw output can be processed.
      const producers = GAME.buildings.filter(b => DEFS[b.type].produces);
      producers.sort((a, b) => !!DEFS[a.type].consumes - !!DEFS[b.type].consumes);
      for (const b of producers) {
        const def = DEFS[b.type], isl = islandOfBuilding(b), R = isl.resources, out = def.rate ?? 1;
        if (!GAME.connected.has(b.id)) { b.status = 'noroad'; continue; }
        if (!b.staffed) { b.status = 'noworkers'; continue; }
        if (R[def.produces] >= isl.cap) { b.status = 'full'; continue; }
        const inputs = Object.entries(def.consumes || {});
        if (inputs.some(([r, n]) => R[r] < n)) { b.status = 'noinput'; continue; }
        let made = out;
        if (def.harvest) {
          // Woodcutters and stonecutters take their goods from the map around them
          const src = harvestTarget(b);
          if (!src) {
            b.status = 'noresource';
            warnOnce(`depleted-${b.id}`, `🪓 ${def.name} på ${isl.name} har ikke flere ${def.harvest.label} i nærheden`, 600);
            continue;
          }
          made = Math.min(out, src[def.harvest.key]);
          src[def.harvest.key] -= made;
          depleteTile(src);
        }
        for (const [r, n] of inputs) { R[r] -= n; isl.flowOut[r] += n; }
        R[def.produces] = Math.min(isl.cap, R[def.produces] + made);
        isl.flowIn[def.produces] += made;
        b.status = 'ok';
      }

      // Foresters plant and tend trees; the wild slowly grows back by itself
      for (const b of GAME.buildings) {
        if (b.type !== 'forester') continue;
        b.status = !b.staffed ? 'noworkers' : tendForest(b) ? 'planting' : 'idle';
      }
      naturalRegrowth();

      // Shipyards
      for (const b of GAME.buildings) {
        if (b.type !== 'shipyard') continue;
        const linked = GAME.connected.has(b.id);
        b.status = !linked ? 'noroad' : !b.staffed ? 'noworkers' : b.queue ? 'building' : 'idle';
        if (b.queue && linked && b.staffed && ++b.queue.progress >= SHIP_TYPES[b.queue.type].buildTime) {
          spawnShip(b.queue.type, b);
          b.queue = null;
        }
      }

      // Residents' needs, growth and taxes, per island
      let tax = 0;
      for (const isl of islands) {
        const byL = popByLevel(isl);
        const upper = byL[2] + byL[3];
        const demand = {
          meat: upper * NEED_RATES.meat,
          cloth: upper * NEED_RATES.cloth,
          beer: byL[3] * NEED_RATES.beer,
          food: Math.max(0, isl.pop - FREE_SETTLERS) * NEED_RATES.food
        };
        // Meat is eaten as a need first; general food (fish or meat) afterwards
        for (const need of ['meat', 'cloth', 'beer', 'food']) {
          const eaten = consume(isl, NEED_INFO[need].keys, demand[need]);
          // With no one to consume it yet, a need counts as met when the goods are in stock
          isl.needsMet[need] = demand[need] > 1e-9 ? eaten >= demand[need] - 1e-6 : (need === 'food' || inStock(isl, need));
        }
        const fed = isl.needsMet.food;
        const hasFood = FOOD_KEYS.some(k => isl.resources[k] > 0);
        if (fed) isl.hunger = 0;
        else {
          if (++isl.hunger === 1 && isl.pop > 0) warnOnce(`hunger-${isl.name}`, `🍽️ Beboerne på ${isl.name} sulter!`, 60);
          if (isl.hunger % STARVE_TICKS === 0 && isl.pop > 0) isl.pop--;
        }
        if (isl.pop > isl.popCap) isl.pop--;
        else if (fed && hasFood && isl.pop < isl.popCap) isl.pop = Math.min(isl.popCap, isl.pop + 1 + Math.floor(isl.popCap / 60));
        else if (isl.pop < Math.min(isl.popCap, FREE_SETTLERS)) isl.pop++; // first settlers come even without food

        for (let L = 1; L <= 3; L++) {
          const happy = HOUSE_LEVELS[L].needs.every(n => isl.needsMet[n]);
          tax += byL[L] * HOUSE_LEVELS[L].tax * (happy ? 1 : 0.5);
        }

        if (isl.pop > 0 && GAME.buildings.some(b => DEFS[b.type].workers && !b.staffed && islandOfBuilding(b) === isl)) {
          warnOnce(`workers-${isl.name}`, `👷 Der mangler arbejdere på ${isl.name} – byg flere boliger`, 180);
        }
        for (const k of RES_KEYS) {
          if (isl.cap && isl.flowIn[k] > 0 && isl.resources[k] >= isl.cap) {
            warnOnce(`full-${isl.name}-${k}`, `📦 Lageret på ${isl.name} er fuldt af ${RESOURCES[k].name.toLowerCase()}`, 240);
          }
        }
      }

      // Coins: taxes in, upkeep of buildings and ships out
      const upkeep = GAME.buildings.reduce((s, b) => s + (DEFS[b.type].upkeep || 0), 0) +
                     GAME.ships.reduce((s, sh) => s + SHIP_TYPES[sh.type].upkeep, 0);
      GAME.coins += tax - upkeep;
      GAME.lastTax = tax;
      GAME.lastUpkeep = upkeep;
      if (GAME.coins < 0) warnOnce('debt', '⚠ Du er i gæld! Byg ikke mere, før skatten overstiger driften.', 90);

      if (GAME.tick % UPGRADE_EVERY === 0) upgradeHouses(islands);
      checkQuests();
      if (rocksDirty) { rocksDirty = false; decorateTerrain(GAME.grid); } // rebuild shrinking mountains

      GAME.tick++;
      if (GAME.tick % AUTOSAVE_TICKS === 0) saveGame();
    }

    // One house per island may upgrade when the island's houses are (nearly) full, the house's current needs
    // are met, the next level's goods are in stock and the island can pay the materials.
    function upgradeHouses(islands) {
      for (const isl of islands) {
        if (!isl.houses || isl.pop < isl.popCap * 0.9) continue;
        const b = GAME.buildings.find(h => DEFS[h.type].house && islandOfBuilding(h) === isl && (h.level || 1) < 3 &&
          HOUSE_LEVELS[h.level || 1].needs.every(n => isl.needsMet[n]) &&
          HOUSE_LEVELS[(h.level || 1) + 1].needs.every(n => inStock(isl, n)) &&
          hasCost(isl.resources, HOUSE_LEVELS[h.level || 1].upgrade));
        if (!b) continue;
        payCost(isl.resources, HOUSE_LEVELS[b.level].upgrade);
        b.level++;
        notify(`🏠 En bolig på ${isl.name} er blevet til ${tierName(b.level)}`, false);
        if (b.level > GAME.tierReached) {
          GAME.tierReached = b.level;
          const unlocked = [...Object.values(DEFS).filter(d => d.tier === b.level).map(d => d.name),
                            ...Object.values(SHIP_TYPES).filter(t => t.tier === b.level).map(t => t.name)];
          notify(`🎉 Du har nu ${tierName(b.level)}! Låst op: ${unlocked.join(', ')}`);
        }
      }
      updateIslandStats();
    }

    // ===== MAIN LOOP =====
    let acc = 0, lastTime = 0, infoTimer = 0;
    function gameLoop(t) {
      if (!lastTime) lastTime = t;
      const dt = Math.min(250, t - lastTime);
      lastTime = t;
      animTime = t;
      updateKeyboardPan(dt);
      const gdt = dt * GAME.speed; // game time runs at the chosen speed (0 = paused)
      updateShips(gdt);

      acc += gdt;
      while (acc >= 1000) {
        tick();
        acc -= 1000;
      }

      render();
      updateHud();
      refreshMenuState();
      infoTimer += dt;
      if (infoTimer > 500) {
        infoTimer = 0;
        renderInfo();
        renderQuest();
        renderMessages();
      }

      requestAnimationFrame(gameLoop);
    }

    function updateHud() {
      const isl = activeIsland();
      const net = (GAME.lastTax || 0) - (GAME.lastUpkeep || 0);
      document.getElementById('coins').innerHTML =
        `🪙 ${Math.floor(GAME.coins)} <small class="${net < 0 ? 'neg' : 'pos'}">${net >= 0 ? '+' : ''}${rate(net)}/s</small>`;
      document.getElementById('pop').textContent = `👥 ${totalPopulation()} / ${totalPopCap()} · ${tierName(GAME.tierReached)}`;
      const fert = isl?.fertility.map(f => FERTILITY[f].icon).join('') || '';
      document.getElementById('island-name').textContent =
        `📍 ${isl ? isl.name : 'Havet'} ${fert}${isl && !isl.warehouses ? ' (intet lager)' : ''}`;
      document.getElementById('tick').textContent = `Tick: ${GAME.tick}${GAME.speed === 0 ? ' · ⏸ Pause' : ''}`;
      const unlinked = GAME.buildings.filter(b => needsRoad(DEFS[b.type]) && !GAME.connected.has(b.id)).length;
      document.getElementById('status').textContent =
        unlinked ? `⚠ ${unlinked} bygning${unlinked > 1 ? 'er' : ''} mangler vej til lager` : '';
      const hungry = [...GAME.islands.values()].filter(i => i.hunger > 0 && i.pop > 0).map(i => i.name);
      document.getElementById('food-status').textContent = hungry.length ? `🍽️ Sult på ${hungry.join(', ')}` : '';
      document.getElementById('saved-at').textContent =
        lastSavedAt ? `Gemt ${lastSavedAt.toLocaleTimeString('da-DK')}` : 'Ikke gemt endnu';
    }

    // ===== INIT =====
    window.addEventListener('DOMContentLoaded', () => {
      log('Initializing game...', 'info');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const loaded = loadGame();
      if (!loaded) {
        log('Generating terrain...', 'ok');
        GAME.grid = generateTerrain(MAP_SIZE, MAP_SIZE);
        initIslands();
        GAME.coins = START_COINS;
        centerOn(MAP_SIZE / 2, MAP_SIZE / 2);
      }
      decorateTerrain(GAME.grid);
      buildMenu();
      setSpeed(1);

      if (GAME.phase === 'play') {
        document.getElementById('banner').hidden = true;
        recomputeConnectivity();
        resumeShips();
        refreshMenuState();
        log('Gemt spil indlæst', 'ok');
        showToast(migratedFrom ? '📂 Dit spil er opdateret til den nye version (boliger og mønter er nulstillet)' : '📂 Dit gemte spil er indlæst');
      } else {
        // Setup phase: the player picks where the first (free) warehouse goes
        openBuildCategory('harbor');
        selectTool('warehouse');
        log('Vælg hvor dit første lager skal stå', 'ok');
        if (oldSaveIgnored) showToast('Dit gemte spil var fra en ældre version – et nyt kort er lavet');
      }
      // Save right away so even the freshly generated map survives a reload
      if (!loaded) saveGame();
      renderQuest();
      for (const msg of pendingNotices) notify(msg, false);
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
